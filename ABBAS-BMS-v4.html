<body>
<div class="box">
  <h1>ABBAS <span>BMS</span></h1>
  <p>Business Management System</p>
  <label>User</label>
  <select id="U">
    <option value="">-- Select --</option>
    <option value="admin">Admin</option>
    <option value="ob1">Order Booker 1</option>
    <option value="ob2">Order Booker 2</option>
    <option value="ob3">Order Booker 3</option>
    <option value="ob4">Order Booker 4</option>
    <option value="ob5">Order Booker 5</option>
    <option value="sr">Stock Reporter</option>
  </select>
  <label>Password</label>
  <input type="password" id="P" placeholder="Password...">
  <button id="BTN">Login</button>
  <div class="err" id="E"></div>
  <button class="clr" id="CLR">Cache Clear</button>
</div>
<script>
var PASS = {admin:"1111",ob1:"2222",ob2:"3333",ob3:"4444",ob4:"5555",ob5:"6666",sr:"7777"};
var NAMES = {admin:"Admin",ob1:"Order Booker 1",ob2:"Order Booker 2",ob3:"Order Booker 3",ob4:"Order Booker 4",ob5:"Order Booker 5",sr:"Stock Reporter"};
var TYPES = {admin:"admin",ob1:"ob",ob2:"ob",ob3:"ob",ob4:"ob",ob5:"ob",sr:"sr"};

var CU = null;

function login(){
  var u = document.getElementById("U").value;
  var p = document.getElementById("P").value;
  var e = document.getElementById("E");
  e.style.display = "none";
  if(!u){e.style.display="block";e.textContent="User select karein!";return;}
  if(PASS[u] !== p){
    e.style.display="block";
    e.textContent="Galat password! Sahi: "+PASS[u];
    return;
  }
  CU = {id:u, name:NAMES[u], type:TYPES[u]};
  try{localStorage.setItem("cu3", JSON.stringify(CU));}catch(x){}
  loadApp();
}

document.getElementById("BTN").onclick = login;
document.getElementById("P").onkeydown = function(e){if(e.key==="Enter") login();};
document.getElementById("CLR").onclick = function(){localStorage.clear();location.reload();};

// Auto login
try{
  var s = localStorage.getItem("cu3");
  if(s){
    var u = JSON.parse(s);
    if(u && u.id && PASS[u.id]){CU=u;loadApp();}
    else localStorage.removeItem("cu3");
  }
}catch(x){localStorage.removeItem("cu3");}

// FIREBASE
var db,dbL,dbB;
function initFirebase(){
  try{
    if(typeof firebase==="undefined") return setTimeout(initFirebase,200);
    if(!firebase.apps.length){
      firebase.initializeApp({databaseURL:"https://abbas-trd-default-rtdb.firebaseio.com/"});
    }
    try{firebase.initializeApp({databaseURL:"https://master-loading-default-rtdb.firebaseio.com/"},"L");}catch(e){}
    try{firebase.initializeApp({databaseURL:"https://master-billing-1b88b-default-rtdb.firebaseio.com/"},"B");}catch(e){}
    db=firebase.database();
    dbL=firebase.app("L").database();
    dbB=firebase.app("B").database();
    loadData();
  }catch(x){console.log("FB:",x.message);}
}

var prods=[],bills=[],wasoliArr=[],sheets=[],godamArr=[],custs=[],pendArr=[];
var selI={},selR={},curCat="All",curBid=null,apId=null,lineCount=0;
var hisab=JSON.parse(localStorage.getItem("ah")||"{}");

function loadData(){
  if(!db){setTimeout(loadData,300);return;}
  db.ref(".info/connected").on("value",function(s){
    var el=document.getElementById("SDOT");
    var tx=document.getElementById("STXT");
    if(el) el.className="sd"+(s.val()?" on":"");
    if(tx) tx.textContent=s.val()?"Online":"Offline";
  });
  dbB.ref("products").on("value",function(s){prods=[];s.forEach(function(c){prods.push(c.val());});});
  dbB.ref("bills").on("value",function(s){bills=[];s.forEach(function(c){bills.unshift(c.val());});bills.sort(function(a,b){return b.id-a.id;});});
  dbL.ref("sheets").on("value",function(s){sheets=[];s.forEach(function(c){sheets.unshift(c.val());});sheets.sort(function(a,b){return b.id-a.id;});});
  dbL.ref("godam").on("value",function(s){godamArr=[];s.forEach(function(c){godamArr.push(c.val());});});
  db.ref("customers").on("value",function(s){custs=[];s.forEach(function(c){custs.push(c.val());});});
  db.ref("wasoli").on("value",function(s){wasoliArr=[];s.forEach(function(c){wasoliArr.unshift(c.val());});wasoliArr.sort(function(a,b){return b.id-a.id;});});
  db.ref("pending").on("value",function(s){
    pendArr=[];s.forEach(function(c){pendArr.push(c.val());});
    var pb=document.getElementById("PBC");
    if(pb){pb.textContent=pendArr.length;pb.style.display=pendArr.length>0?"inline":"none";}
  });
}

function loadApp(){
  document.body.innerHTML = getAppHTML();
  initFirebase();
  goTo("dashboard");
}

function fmt(n){return Math.round(n||0).toLocaleString();}
function fmtD(d){if(!d)return"";try{return new Date(d).toLocaleDateString("en-PK",{day:"2-digit",month:"short",year:"numeric"});}catch(e){return d;}}
function uc(u){var m={ob1:"b",ob2:"p",ob3:"o",ob4:"g",ob5:"a",sr:"o",admin:"b"};return m[u]||"b";}
function toggleFB(id){var f=document.getElementById(id);if(f)f.className=f.className.indexOf("show")>-1?"fb":"fb show";}

  if(a) nav+="<div class='ni' id='ni-targets' onclick='goTo(\"targets\")'><span>🎯</span>OB Targets</div>";

  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ABBAS BMS</title><style>

function setupAC(inpId,lstId,filterFn){
  var inp=document.getElementById(inpId);var lst=document.getElementById(lstId);
  if(!inp||!lst)return;
  var idx=-1;
  function show(){
    idx=-1;
    var v=inp.value.trim().toLowerCase();
    if(!v){lst.className="acl";return;}
    var src=filterFn?custs.filter(filterFn):custs;
    var m=src.filter(function(c){return c.name&&c.name.toLowerCase().indexOf(v)>-1;});
    if(!m.length){lst.className="acl";return;}
    var h="";
    for(var i=0;i<m.length;i++){
      var c=m[i];var bal=c.balance||0;var bn=c.booker&&PASS[c.booker]?NAMES[c.booker]:"";
      h+="<div class='aci' data-cid='"+c.id+"'><div class='ain'>"+c.name+"</div><div class='ais'>"+(c.phone?"📞 "+c.phone+" ":"")+(c.route?"· "+c.route+" ":"")+(bn?"· "+bn:"")+"</div>"+(bal>0?"<div style='font-size:10px;font-weight:700;color:#dc2626;'>Baqi: Rs "+fmt(bal)+"</div>":"")+"</div>";
    }
    lst.innerHTML=h;lst.className="acl show";
    lst.querySelectorAll(".aci").forEach(function(el){el.onclick=function(){pickC(inpId,lstId,this.dataset.cid);};});
  }
  inp.oninput=show;
  inp.onkeydown=function(e){
    var items=lst.querySelectorAll(".aci");if(!items.length)return;
    if(e.key==="ArrowDown"){e.preventDefault();idx=Math.min(idx+1,items.length-1);}
    else if(e.key==="ArrowUp"){e.preventDefault();idx=Math.max(idx-1,0);}
    else if(e.key==="Enter"){e.preventDefault();if(idx>=0&&items[idx])pickC(inpId,lstId,items[idx].dataset.cid);else if(items.length===1)pickC(inpId,lstId,items[0].dataset.cid);return;}
    else if(e.key==="Escape"){lst.className="acl";idx=-1;return;}
    items.forEach(function(el,i){el.className=i===idx?"aci hi":"aci";});
    if(items[idx])items[idx].scrollIntoView({block:"nearest"});
  };
  document.addEventListener("click",function(e){if(!inp.contains(e.target)&&!lst.contains(e.target))lst.className="acl";});
}

function pickC(inpId,lstId,cid){
  var c=custs.find(function(x){return x.id==cid;});if(!c||!c.name)return;
  document.getElementById(inpId).value=c.name;
  document.getElementById(lstId).className="acl";
  var ph=document.getElementById("o-ph");if(ph)ph.value=c.phone||"";
  var rt=document.getElementById("o-rt");if(rt)rt.value=c.route||"";
  var sl=document.getElementById("o-sl");if(sl&&c.booker&&NAMES[c.booker])sl.value=NAMES[c.booker];

}

function sendLedWA(name){
  var cb=bills.filter(function(b){return b.cname.toLowerCase()===name.toLowerCase();});
  var cw=wasoliArr.filter(function(w){return w.cname.toLowerCase()===name.toLowerCase();});
  var tb=cb.reduce(function(s,b){return s+(b.grandTotal||0);},0);var tp=cw.reduce(function(s,w){return s+w.amount;},0);var bal=Math.max(0,tb-tp);
  var msg="*"+name+"* — Account Statement\n━━━━━━━━━━━━━━\n\n";
  if(cb.length){msg+="🧾 *Bills:*\n";cb.slice(0,5).forEach(function(b,i){msg+=(i+1)+". "+b.date+" — Rs "+fmt(b.grandTotal)+"\n";});if(cb.length>5)msg+="... aur "+(cb.length-5)+" bills\n";msg+="\n";}
  if(cw.length){msg+="💰 *Wasoli:*\n";cw.slice(0,5).forEach(function(w,i){msg+=(i+1)+". "+fmtD(w.date)+" — Rs "+fmt(w.amount)+"\n";});if(cw.length>5)msg+="... aur "+(cw.length-5)+" payments\n";msg+="\n";}
  msg+="━━━━━━━━━━━━━━\nTotal Bills: Rs "+fmt(tb)+"\nTotal Paid: Rs "+fmt(tp)+"\n*Baqi: Rs "+fmt(bal)+"*\n— ABBAS Distribution";
  window._wMsg=msg;
  var cust=custs.find(function(c){return c.name.toLowerCase()===name.toLowerCase();});
  var phone=cust&&cust.phone?cust.phone:"";
  if(!phone){showPhoneModal("LWA","lwa-inp","doLedWAFn");return;}
  openWA(phone,msg);
}

function renderCL(mc,a){var el=document.getElementById("CL");if(!el)return;if(!mc.length){el.innerHTML="<div class='emp'><div class='empi'>👥</div><div>Koi customer nahi</div></div>";return;}var h="";mc.forEach(function(c){h+="<div class='ic' style='margin-bottom:6px;'><div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:"+(a?"5":"0")+"px;'><div><div class='it'>"+c.name+"</div><div class='im'>"+(c.phone?"📞 "+c.phone:"<span style='color:#dc2626;'>📞 nahi</span>")+(c.route?" · "+c.route:"")+(c.booker?" · <span class='bdg b'>"+c.booker+"</span>":"")+"</div></div><div>"+(c.balance>0?"<span style='color:#dc2626;font-weight:700;font-size:13px;'>Rs "+fmt(c.balance)+"</span>":"<span class='bdg g'>Clear</span>")+"</div></div>"+(a?"<div style='display:flex;gap:5px;'><button class='btn bgh' style='padding:4px 9px;font-size:11px;' onclick='editC("+c.id+")'>✏️ Edit</button><button class='btn bgh' style='padding:4px 9px;font-size:11px;' onclick='delCust("+c.id+")'>🗑</button></div>":"")+"</div>";});el.innerHTML=h;}
function delCust(id){if(!confirm("Delete?"))return;db.ref("customers/"+id).remove();}
function editC(id){var c=custs.find(function(x){return x.id==id;});if(!c)return;var existing=document.getElementById("EC_OV");if(existing)existing.parentElement.remove();var d=document.createElement("div");d.innerHTML="<div class='ov show' id='EC_OV'><div class='sh'><h3>✏️ Edit — "+c.name+"</h3><div style='background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13px;font-weight:700;color:#1d4ed8;'>"+c.name+"</div><div class='fl' style='margin-bottom:10px;'><label>📞 Phone</label><input class='si' id='EC_PH' value='"+(c.phone||"")+"' placeholder='03001234567' type='tel'></div><div class='fl' style='margin-bottom:10px;'><label>🛣️ Route</label><input class='si' id='EC_RT' value='"+(c.route||"")+"' placeholder='Hayatabad...'></div><div class='fl' style='margin-bottom:10px;'><label>👤 Order Booker</label><select class='si' id='EC_OB'><option value=''>--</option><option value='ob1'"+(c.booker==="ob1"?" selected":"")+">OB 1</option><option value='ob2'"+(c.booker==="ob2"?" selected":"")+">OB 2</option><option value='ob3'"+(c.booker==="ob3"?" selected":"")+">OB 3</option><option value='ob4'"+(c.booker==="ob4"?" selected":"")+">OB 4</option><option value='ob5'"+(c.booker==="ob5"?" selected":"")+">OB 5</option></select></div><div class='fl' style='margin-bottom:10px;'><label>💰 Baqi Balance</label><input class='si' type='number' id='EC_BL' value='"+(c.balance||0)+"'></div><div class='sb2'><button class='sc2' onclick='this.closest(\".ov\").parentElement.remove()'>Cancel</button><button class='btn bg bfw' onclick='saveEC("+id+")'>✓ Save</button></div></div></div>";document.body.appendChild(d);setTimeout(function(){var ph=document.getElementById("EC_PH");if(ph)ph.focus();},100);}
function saveEC(id){db.ref("customers/"+id).update({phone:document.getElementById("EC_PH").value.trim(),route:document.getElementById("EC_RT").value.trim(),booker:document.getElementById("EC_OB").value,balance:parseFloat(document.getElementById("EC_BL").value)||0},function(err){if(!err){document.getElementById("EC_OV").parentElement.remove();alert("✅ Update!");}else alert("Error: "+err.message);});}

function pgLoading(){
  if(CU.type==="ob"){document.getElementById("CT").innerHTML="<div class='emp'><div class='empi'>🔒</div><div>Sirf Admin ya SR</div></div>";return;}
  var h="<div class='shd'><h2>🚚 Loading Sheet</h2><button class='btn bo' onclick='toggleFB(\"LF\")'>＋ Nayi</button></div>";
  h+="<div class='fb' id='LF'><div class='fg g2'><div class='fl'><label>Driver</label><input id='l-drv' placeholder='Ahmad...'></div><div class='fl'><label>Gadi No</label><input id='l-veh' placeholder='LEA-1234'></div></div><div class='fg g2'><div class='fl'><label>Route</label><input id='l-rte' placeholder='Hayatabad...'></div><div class='fl'><label>Date & Time</label><input type='datetime-local' id='l-dt'></div></div><div id='LC'></div><button class='lapl' onclick='addLine()'>＋ Line Add</button><button class='btn bo bfw' onclick='saveSheet()'>✅ Save</button></div>";
  h+="<div id='SL'></div>";document.getElementById("CT").innerHTML=h;
  var now=new Date();var ldt=document.getElementById("l-dt");if(ldt)ldt.value=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,16);
  lineCount=0;addLine();renderSL();
}
function addLine(){lineCount++;var lc=lineCount;var cont=document.getElementById("LC");if(!cont)return;var div=document.createElement("div");div.className="lc2";div.id="LC"+lc;div.innerHTML="<div class='lh'><span class='lbdg'>Line "+lc+"</span><span class='lt' id='LT"+lc+"'>0</span></div><div id='LP"+lc+"'></div><button class='lap' onclick='addLP("+lc+")'>＋ Product</button>";cont.appendChild(div);addLP(lc);}
function addLP(ln){var c=document.getElementById("LP"+ln);if(!c)return;var r=document.createElement("div");r.className="lpr";r.innerHTML="<input type='text' class='lpi' placeholder='Product...' oninput='calcLT("+ln+")'><input type='number' class='lpn' placeholder='Qty' min='0' oninput='calcLT("+ln+")'><button class='lpd' onclick='this.parentElement.remove();calcLT("+ln+")'>✕</button>";c.appendChild(r);}
function calcLT(ln){var t=0;var c=document.getElementById("LP"+ln);if(c)c.querySelectorAll(".lpr").forEach(function(r){t+=parseFloat(r.querySelectorAll("input")[1].value)||0;});var lt=document.getElementById("LT"+ln);if(lt)lt.textContent=t;}
function saveSheet(){var driver=document.getElementById("l-drv").value.trim();if(!driver){alert("Driver zaroor!");return;}var lines=[],total=0;for(var i=1;i<=lineCount;i++){var el=document.getElementById("LC"+i);if(!el)continue;var prds=[];el.querySelectorAll(".lpr").forEach(function(r){var n=r.querySelectorAll("input")[0].value.trim();var q=parseFloat(r.querySelectorAll("input")[1].value)||0;if(n&&q>0){prds.push({name:n,qty:q});total+=q;}});if(prds.length)lines.push({lineNum:i,products:prds});}if(!lines.length){alert("Ek product!");return;}var id=Date.now();dbL.ref("sheets/"+id).set({id:id,driver:driver,vehicle:document.getElementById("l-veh").value.trim(),route:document.getElementById("l-rte").value.trim(),datetime:document.getElementById("l-dt").value,lines:lines,totalItems:total,savedAt:new Date().toISOString(),addedBy:CU.id});lines.forEach(function(l){l.products.forEach(function(p){var g=godamArr.find(function(x){return x.name.toLowerCase()===p.name.toLowerCase();});if(g){var hi=g.history||[];hi.unshift({type:"out",qty:p.qty,date:new Date().toISOString().split("T")[0],note:"Gadi: "+driver});dbL.ref("godam/"+g.id).update({stock:g.stock-p.qty,history:hi});}});});document.getElementById("LF").className="fb";lineCount=0;document.getElementById("LC").innerHTML="";alert("✅ Sheet save!");addLine();renderSL();}
function renderSL(){var el=document.getElementById("SL");if(!el)return;if(!sheets.length){el.innerHTML="<div class='emp'><div class='empi'>🚚</div><div>Koi sheet nahi</div></div>";return;}var h="";sheets.slice(0,20).forEach(function(s){h+="<div class='ic' style='margin-bottom:7px;'><div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;'><div><div class='it'>🚗 "+s.driver+(s.vehicle?" · "+s.vehicle:"")+"</div><div class='im'>"+(s.route?s.route+" · ":"")+fmtD(s.datetime?s.datetime.split("T")[0]:"")+"</div></div><span class='bdg o'>"+s.totalItems+" items</span></div><div class='ibs'><button class='btn bgh' style='padding:4px 9px;font-size:11px;' onclick='delSheet("+s.id+")'>🗑</button></div></div>";});el.innerHTML=h;}
function delSheet(id){if(!confirm("Delete?"))return;dbL.ref("sheets/"+id).remove();}

function pgTarget(){
  if(CU.type!=="ob"){document.getElementById("CT").innerHTML="<div class='emp'><div class='empi'>🔒</div><div>Sirf OB</div></div>";return;}
  var curMonth=new Date().toISOString().slice(0,7);
  document.getElementById("CT").innerHTML="<div class='shd'><h2>🎯 Mera Target</h2></div><div id='MYTG'><div style='text-align:center;padding:20px;color:#64748b;'>Loading...</div></div>";
  db.ref("targets/"+curMonth+"/"+CU.id).once("value",function(snap){
    var tg=snap.val();var target=tg?tg.amount:0;
    var achieved=bills.filter(function(b){return b.addedBy===CU.id&&b.approved===true&&b.savedAt&&b.savedAt.slice(0,7)===curMonth;}).reduce(function(s,b){return s+(b.grandTotal||0);},0);
    var pct=target>0?Math.min(100,Math.round(achieved/target*100)):0;
    var color=pct>=100?"#16a34a":pct>=70?"#d97706":"#dc2626";var baqi=Math.max(0,target-achieved);
    var el=document.getElementById("MYTG");if(!el)return;
    if(!target){el.innerHTML="<div class='emp'><div class='empi'>🎯</div><div>Target set nahi — Admin se poochein</div></div>";return;}
    var r=65,cx=80,cy=80,circ=2*Math.PI*r,dash=circ*(pct/100);
    var h="<div style='background:white;border:1px solid #e2e8f0;border-radius:12px;padding:18px;margin-bottom:12px;text-align:center;'><div style='font-size:12px;font-weight:700;color:#64748b;margin-bottom:12px;'>"+curMonth+"</div><svg width='160' height='160' style='display:block;margin:0 auto;'><circle cx='"+cx+"' cy='"+cy+"' r='"+r+"' fill='none' stroke='#f1f5f9' stroke-width='12'/><circle cx='"+cx+"' cy='"+cy+"' r='"+r+"' fill='none' stroke='"+color+"' stroke-width='12' stroke-dasharray='"+dash+" "+circ+"' stroke-linecap='round' transform='rotate(-90 "+cx+" "+cy+")'/>"+
    "<text x='"+cx+"' y='"+(cy-6)+"' text-anchor='middle' font-size='26' font-weight='700' fill='"+color+"'>"+pct+"%</text>"+
    "<text x='"+cx+"' y='"+(cy+18)+"' text-anchor='middle' font-size='12' fill='#64748b'>Achieved</text></svg>"+
    "<div style='font-size:14px;font-weight:700;color:"+color+";margin-top:8px;'>"+(pct>=100?"🎉 Target Poora!":pct>=70?"💪 Achha ja rahe ho!":"⚡ Mehnat karo!")+"</div></div>";
    h+="<div class='dg' style='grid-template-columns:1fr 1fr 1fr;'><div class='dc'><div class='dl'>Target</div><div class='dv b'>Rs "+fmt(target)+"</div></div><div class='dc'><div class='dl'>Achieve</div><div class='dv g'>Rs "+fmt(achieved)+"</div></div><div class='dc'><div class='dl'>Baqi</div><div class='dv r'>Rs "+fmt(baqi)+"</div></div></div>";
    h+="<div style='background:white;border:1px solid #e2e8f0;border-radius:9px;padding:13px;margin-top:10px;'><div style='display:flex;justify-content:space-between;font-size:11px;color:#64748b;margin-bottom:6px;'><span>0</span><span>Rs "+fmt(target)+"</span></div><div style='background:#f1f5f9;border-radius:20px;height:14px;overflow:hidden;'><div style='background:"+color+";height:100%;border-radius:20px;width:"+pct+"%;'></div></div><div style='text-align:center;margin-top:7px;font-size:12px;color:#64748b;'>"+fmt(baqi)+" aur chahiye</div></div>";
    el.innerHTML=h;
  });
}

function pgTargets(){
  if(CU.type!=="admin"){document.getElementById("CT").innerHTML="<div class='emp'><div class='empi'>🔒</div><div>Sirf Admin</div></div>";return;}
  var curMonth=new Date().toISOString().slice(0,7);
  var obList=["ob1","ob2","ob3","ob4","ob5"];
  var h="<div class='shd'><h2>🎯 OB Targets</h2></div>";
  h+="<div class='fb show' style='margin-bottom:14px;'><div class='fg g2'><div class='fl'><label>Order Booker</label><select id='tg-ob'>"+obList.map(function(ob){return"<option value='"+ob+"'>"+NAMES[ob]+"</option>";}).join("")+"</select></div><div class='fl'><label>Target (Rs)</label><input type='number' id='tg-amt' placeholder='100000'></div></div><div class='fg g2'><div class='fl'><label>Month</label><input type='month' id='tg-month' value='"+curMonth+"'></div><div class='fl'><label>Note</label><input id='tg-note' placeholder='...'></div></div><button class='btn bg bfw' onclick='saveTarget()'>✓ Set Karein</button></div>";
  h+="<div id='TGL'></div>";
  document.getElementById("CT").innerHTML=h;renderTGL(curMonth);
}
function saveTarget(){var ob=document.getElementById("tg-ob").value;var amt=parseFloat(document.getElementById("tg-amt").value);var month=document.getElementById("tg-month").value;if(!amt){alert("Amount zaroor!");return;}db.ref("targets/"+month+"/"+ob).set({ob:ob,amount:amt,month:month,note:document.getElementById("tg-note").value.trim(),setAt:new Date().toISOString()},function(){alert("✅ Target set!");renderTGL(month);});}
function renderTGL(month){var el=document.getElementById("TGL");if(!el)return;el.innerHTML="<div style='text-align:center;padding:15px;color:#64748b;font-size:13px;'>Loading...</div>";db.ref("targets/"+month).once("value",function(snap){var targets={};snap.forEach(function(c){targets[c.key]=c.val();});var h="";["ob1","ob2","ob3","ob4","ob5"].forEach(function(ob){var tg=targets[ob];var target=tg?tg.amount:0;var achieved=bills.filter(function(b){return b.addedBy===ob&&b.approved===true&&b.savedAt&&b.savedAt.slice(0,7)===month;}).reduce(function(s,b){return s+(b.grandTotal||0);},0);var pct=target>0?Math.min(100,Math.round(achieved/target*100)):0;var color=pct>=100?"#16a34a":pct>=70?"#d97706":"#dc2626";var bgc=pct>=100?"#dcfce7":pct>=70?"#fef3c7":"#fee2e2";var baqi=Math.max(0,target-achieved);h+="<div style='background:white;border:1px solid #e2e8f0;border-radius:11px;padding:13px;margin-bottom:10px;'><div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;'><div style='font-size:14px;font-weight:700;'>"+NAMES[ob]+"</div><span style='background:"+bgc+";color:"+color+";font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;'>"+pct+"% "+(pct>=100?"✅":"")+"</span></div><div style='background:#f1f5f9;border-radius:20px;height:10px;overflow:hidden;margin-bottom:10px;'><div style='background:"+color+";height:100%;border-radius:20px;width:"+pct+"%;'></div></div><div style='display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;text-align:center;'><div style='background:#f8fafc;border-radius:7px;padding:7px;'><div style='font-size:10px;color:#64748b;font-weight:700;text-transform:uppercase;margin-bottom:2px;'>Target</div><div style='font-size:13px;font-weight:700;color:#2563eb;'>Rs "+fmt(target)+"</div></div><div style='background:#f8fafc;border-radius:7px;padding:7px;'><div style='font-size:10px;color:#64748b;font-weight:700;text-transform:uppercase;margin-bottom:2px;'>Achieve</div><div style='font-size:13px;font-weight:700;color:#16a34a;'>Rs "+fmt(achieved)+"</div></div><div style='background:#f8fafc;border-radius:7px;padding:7px;'><div style='font-size:10px;color:#64748b;font-weight:700;text-transform:uppercase;margin-bottom:2px;'>Baqi</div><div style='font-size:13px;font-weight:700;color:#dc2626;'>Rs "+fmt(baqi)+"</div></div></div>"+(target===0?"<div style='margin-top:8px;text-align:center;font-size:11px;color:#94a3b8;'>Target set nahi</div>":"")+"</div>";});el.innerHTML=h;});}
</script>
