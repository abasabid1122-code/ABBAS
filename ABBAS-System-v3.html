<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e293b">
<title>ABBAS — Business System</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#0f172a;--card:#1e293b;--card2:#263348;--border:#334155;
  --text:#f1f5f9;--muted:#94a3b8;
  --green:#22d3a0;--red:#f87171;--blue:#60a5fa;
  --amber:#fbbf24;--purple:#a78bfa;--orange:#fb923c;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;width:100%;max-width:380px;}
.login-logo{text-align:center;margin-bottom:24px;}
.login-logo h1{font-size:28px;font-weight:900;color:var(--text);}
.login-logo h1 span{color:var(--green);}
.login-logo p{font-size:13px;color:var(--muted);margin-top:4px;}
.login-fld{margin-bottom:14px;}
.login-fld label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:5px;}
.login-fld input,.login-fld select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:10px;font-size:15px;outline:none;}
.login-fld input:focus,.login-fld select:focus{border-color:var(--green);}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--green),#0fa97a);color:#0f172a;border:none;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer;margin-top:6px;}
.login-err{background:rgba(248,113,113,0.15);border:1px solid var(--red);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--red);margin-top:10px;display:none;}

/* SIDEBAR */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--card);border-right:1px solid var(--border);z-index:100;display:flex;flex-direction:column;}
.sidebar.hidden{transform:translateX(-220px);}
.logo{padding:18px 16px;border-bottom:1px solid var(--border);}
.logo h1{font-size:18px;font-weight:800;}
.logo h1 span{color:var(--green);}
.logo p{font-size:11px;color:var(--muted);margin-top:2px;}
.user-info{padding:10px 14px;background:var(--card2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.user-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;}
.user-avatar.admin{background:linear-gradient(135deg,var(--green),#0fa97a);color:#0f172a;}
.user-avatar.mobile{background:linear-gradient(135deg,var(--blue),#2563eb);color:#0f172a;}
.user-name{font-size:13px;font-weight:600;}
.user-role{font-size:11px;color:var(--muted);}
.nav{flex:1;padding:10px 8px;overflow-y:auto;}
.nav-sec{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:8px 8px 4px;}
.ni{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:2px;}
.ni:hover{background:var(--card2);color:var(--text);}
.ni.active{background:var(--green);color:#0f172a;font-weight:700;}
.ni .icon{font-size:17px;width:20px;text-align:center;}
.ni .pending-badge{background:var(--red);color:white;font-size:10px;font-weight:800;padding:1px 6px;border-radius:10px;margin-left:auto;}
.sb-foot{padding:10px 12px;border-top:1px solid var(--border);display:flex;gap:8px;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);}
.sync-dot.on{background:var(--green);}
.sb-foot span{font-size:11px;color:var(--muted);}
.logout-btn{background:none;border:none;color:var(--red);font-size:12px;cursor:pointer;margin-left:auto;font-weight:600;}

/* MAIN */
.main{margin-left:220px;min-height:100vh;}
.main.full{margin-left:0;}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:13px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;}
.menu-btn{background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;}
.tb-title{font-size:15px;font-weight:700;flex:1;}
.tb-date{font-size:11px;color:var(--muted);}
.content{padding:16px;}

/* CARDS */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px;}
.dc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;position:relative;overflow:hidden;}
.dc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.dc.g::before{background:var(--green);}
.dc.r::before{background:var(--red);}
.dc.b::before{background:var(--blue);}
.dc.a::before{background:var(--amber);}
.dc.p::before{background:var(--purple);}
.dc.o::before{background:var(--orange);}
.dc-lbl{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}
.dc-val{font-size:18px;font-weight:700;}
.dc-val.g{color:var(--green);}
.dc-val.r{color:var(--red);}
.dc-val.b{color:var(--blue);}
.dc-val.a{color:var(--amber);}
.dc-val.p{color:var(--purple);}
.dc-val.o{color:var(--orange);}
.dc-sub{font-size:11px;color:var(--muted);margin-top:3px;}

/* FORM */
.form-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;display:none;}
.form-box.show{display:block;}
.fg{display:grid;gap:10px;margin-bottom:10px;}
.fg.g2{grid-template-columns:1fr 1fr;}
.fg.g3{grid-template-columns:1fr 1fr 1fr;}
.fld{display:flex;flex-direction:column;gap:3px;}
.fld label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.4px;}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 11px;border-radius:8px;font-size:14px;font-family:inherit;outline:none;}
.fld input:focus,.fld select:focus{border-color:var(--green);}
.fld input::placeholder{color:var(--muted);}

/* AUTOCOMPLETE */
.ac-wrap{position:relative;}
.ac-list{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:8px;z-index:100;max-height:180px;overflow-y:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,0.3);}
.ac-list.show{display:block;}
.ac-item{padding:9px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border);}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover{background:var(--card2);color:var(--green);}

/* BUTTONS */
.btn{padding:8px 14px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
.btn.g{background:var(--green);color:#0f172a;}
.btn.b{background:var(--blue);color:#0f172a;}
.btn.r{background:var(--red);color:#0f172a;}
.btn.a{background:var(--amber);color:#0f172a;}
.btn.p{background:var(--purple);color:#0f172a;}
.btn.o{background:var(--orange);color:#0f172a;}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--border);}
.btn.full{width:100%;justify-content:center;padding:12px;}
.btn:hover{opacity:0.9;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}

/* BADGE */
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;}
.badge.g{background:rgba(34,211,160,0.15);color:var(--green);}
.badge.r{background:rgba(248,113,113,0.15);color:var(--red);}
.badge.b{background:rgba(96,165,250,0.15);color:var(--blue);}
.badge.a{background:rgba(251,191,36,0.15);color:var(--amber);}
.badge.o{background:rgba(251,146,60,0.15);color:var(--orange);}
.badge.p{background:rgba(167,139,250,0.15);color:var(--purple);}

/* ITEM CARDS */
.item-list{display:flex;flex-direction:column;gap:8px;}
.ic{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.ic-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.ic-title{font-size:14px;font-weight:600;}
.ic-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.ic-btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}

/* PROD GRID */
.cat-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none;}
.cat-bar::-webkit-scrollbar{display:none;}
.cat-btn{padding:5px 12px;background:var(--card2);border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;}
.cat-btn.active{background:var(--blue);border-color:var(--blue);color:#0f172a;}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:10px;}
.pt{background:var(--card);border:1.5px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;position:relative;}
.pt:hover,.pt.sel{border-color:var(--blue);background:var(--card2);}
.pt-badge{position:absolute;top:5px;right:5px;background:var(--blue);color:#0f172a;font-size:10px;font-weight:800;width:18px;height:18px;border-radius:50%;display:none;align-items:center;justify-content:center;}
.pt.sel .pt-badge{display:flex;}
.pt-name{font-size:12px;font-weight:700;margin-bottom:3px;}
.pt-cat{font-size:10px;color:var(--muted);margin-bottom:4px;}
.pt-rate{font-size:14px;font-weight:800;color:var(--blue);}

/* BILL ITEMS */
.bir{display:grid;grid-template-columns:1fr 60px 70px 28px;gap:6px;align-items:center;margin-bottom:7px;padding-bottom:7px;border-bottom:1px solid var(--border);}
.bir:last-child{border-bottom:none;}
.bir input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:7px;font-size:13px;text-align:center;width:100%;outline:none;}
.bir-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;}
.bir-del:hover{color:var(--red);}

/* TOTAL BAR */
.total-bar{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;}
.tr{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--border);}
.tr:last-child{border-bottom:none;font-size:15px;font-weight:700;}
.tr-l{color:var(--muted);}

/* PENDING */
.pending-card{background:var(--card);border:1px solid var(--amber);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
.pc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.pc-user{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;}
.pc-user.m1{background:rgba(96,165,250,0.2);color:var(--blue);}
.pc-user.m2{background:rgba(167,139,250,0.2);color:var(--purple);}
.pc-user.m3{background:rgba(251,146,60,0.2);color:var(--orange);}
.pc-user.m4{background:rgba(34,211,160,0.2);color:var(--green);}

/* LEDGER */
.ledger-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.ledger-row:last-child{border-bottom:none;}

/* STOCK CARD */
.sc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;border-left:4px solid var(--green);}
.sc.low{border-left-color:var(--amber);}
.sc.out{border-left-color:var(--red);}
.sc-top{display:flex;justify-content:space-between;align-items:center;}
.sc-name{font-size:14px;font-weight:700;}
.sc-num{font-size:20px;font-weight:900;color:var(--green);}
.sc-num.low{color:var(--amber);}
.sc-num.out{color:var(--red);}

/* OVERLAY */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:flex-end;justify-content:center;}
.ov.show{display:flex;}
.ov.center{align-items:center;}
.sheet{background:var(--card);border-radius:18px 18px 0 0;padding:20px;width:100%;max-width:500px;border-top:1px solid var(--border);max-height:85vh;overflow-y:auto;}
.sheet h3{font-size:16px;font-weight:800;margin-bottom:12px;}
.info-box{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:10px;}
.info-box strong{color:var(--text);}
.sh-inp{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;outline:none;margin-bottom:8px;font-family:inherit;}
.sh-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.sh-cancel{padding:11px;background:var(--card2);border:1px solid var(--border);border-radius:8px;font-size:14px;cursor:pointer;color:var(--text);font-weight:600;}

/* MODAL */
.mwrap{background:var(--card);border-radius:14px;width:95%;max-width:500px;border:1px solid var(--border);overflow:hidden;}
.mhead{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.mhead h2{font-size:16px;font-weight:800;}
.mbody{padding:14px 16px;max-height:55vh;overflow-y:auto;}
.mfoot{padding:10px 16px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

.sec-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.sec-hd h2{font-size:17px;font-weight:700;}
.empty{text-align:center;padding:30px;color:var(--muted);}
.empty-icon{font-size:36px;margin-bottom:8px;}
.ob-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99;}
.ob-bg.show{display:block;}

@media(max-width:768px){
  .sidebar{transform:translateX(-220px);transition:transform 0.3s;}
  .sidebar.mob-show{transform:translateX(0);}
  .main{margin-left:0;}
  .fg.g3{grid-template-columns:1fr 1fr;}
  .dash-grid{grid-template-columns:1fr 1fr;}
  .pg{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));}
}
</style>
</head>
<body>

<div class="ob-bg" id="ob-bg" onclick="closeSidebar()"></div>

<!-- LOGIN PAGE -->
<div id="login-page">
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo">
        <h1>ABBAS <span>BMS</span></h1>
        <p>Business Management System</p>
      </div>
      <div class="login-fld">
        <label>User Select Karein</label>
        <select id="login-user">
          <option value="">-- Select --</option>
          <option value="admin">👑 Admin (Boss)</option>
          <option value="mobile1">📱 Mobile 1</option>
          <option value="mobile2">📱 Mobile 2</option>
          <option value="mobile3">📱 Mobile 3</option>
          <option value="mobile4">📱 Mobile 4</option>
        </select>
      </div>
      <div class="login-fld">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="Password..." onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="login-btn" onclick="doLogin()">Login Karein →</button>
      <div class="login-err" id="login-err">Galat password! Dobara try karein.</div>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app-page" style="display:none;">

<div class="sidebar" id="sidebar">
  <div class="logo">
    <h1>ABBAS <span>BMS</span></h1>
    <p>Business Management System</p>
  </div>
  <div class="user-info">
    <div class="user-avatar" id="u-avatar">A</div>
    <div><div class="user-name" id="u-name">Admin</div><div class="user-role" id="u-role">Administrator</div></div>
  </div>
  <div class="nav" id="nav-menu"></div>
  <div class="sb-foot">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-txt">Connecting...</span>
    <button class="logout-btn" onclick="doLogout()">Logout</button>
  </div>
</div>

<div class="main" id="main">
  <div class="topbar">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <div class="tb-title" id="pg-title">Dashboard</div>
    <div class="tb-date" id="tb-date"></div>
  </div>
  <div class="content" id="content"></div>
</div>

</div>

<!-- WA MODAL -->
<div class="ov" id="wa-ov">
  <div class="sheet">
    <h3>📱 WhatsApp Bill</h3>
    <div class="info-box" id="wa-msg" style="color:var(--green);line-height:1.6;"></div>
    <div class="sh-btns">
      <button class="sh-cancel" onclick="closeWa()">Cancel</button>
      <button class="btn g full" onclick="sendWa()">✓ Send</button>
    </div>
  </div>
</div>

<!-- BILL DETAIL -->
<div class="ov center" id="bd-ov">
  <div class="mwrap">
    <div class="mhead"><h2>🧾 Bill Detail</h2><button class="btn ghost" style="padding:5px 10px;" onclick="closeBD()">✕</button></div>
    <div class="mbody" id="bd-body"></div>
    <div class="mfoot">
      <button class="sh-cancel" onclick="closeBD()">Band</button>
      <button class="btn g" onclick="openWaC()">📱 WA</button>
      <button class="btn p" onclick="printBill()">🖨️ Print</button>
    </div>
  </div>
</div>

<!-- APPROVE MODAL -->
<div class="ov center" id="approve-ov">
  <div class="mwrap">
    <div class="mhead"><h2>✅ Approve Karein</h2><button class="btn ghost" style="padding:5px 10px;" onclick="closeApprove()">✕</button></div>
    <div class="mbody" id="approve-body"></div>
    <div class="mfoot" style="grid-template-columns:1fr 1fr;">
      <button class="btn r full" onclick="rejectEntry()">❌ Reject</button>
      <button class="btn g full" onclick="approveEntry()">✅ Approve</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════
// FIREBASE
// ══════════════════════════════════
const fbApp = firebase.initializeApp({databaseURL:"https://abbas-trd-default-rtdb.firebaseio.com/"});
const db = firebase.database(fbApp);

// Also connect to existing DBs
const fbL = firebase.initializeApp({databaseURL:"https://master-loading-default-rtdb.firebaseio.com/"},'loading');
const fbB = firebase.initializeApp({databaseURL:"https://master-billing-1b88b-default-rtdb.firebaseio.com/"},'billing');
const dbL = firebase.database(fbL);
const dbB = firebase.database(fbB);

// ══════════════════════════════════
// USERS CONFIG
// ══════════════════════════════════
var USERS = {
  admin:   {pass:'admin123', name:'Admin (Boss)', role:'Administrator', color:'admin', route:''},
  mobile1: {pass:'mob1pass',  name:'Mobile 1',    role:'Salesman',      color:'m1',   route:'Route 1'},
  mobile2: {pass:'mob2pass',  name:'Mobile 2',    role:'Salesman',      color:'m2',   route:'Route 2'},
  mobile3: {pass:'mob3pass',  name:'Mobile 3',    role:'Salesman',      color:'m3',   route:'Route 3'},
  mobile4: {pass:'mob4pass',  name:'Mobile 4',    role:'Salesman',      color:'m4',   route:'Route 4'},
};

var currentUser = null;
var products=[], bills=[], sheets=[], godamStock=[], customers=[], pendingEntries=[];
var selectedItems={}, selectedRates={}, currentCat='All', currentBillId=null, approveId=null, approveType=null;
var hisabData = JSON.parse(localStorage.getItem('abbas-hisab')||'{}');

// ══════════════════════════════════
// LOGIN
// ══════════════════════════════════
function doLogin(){
  var u = document.getElementById('login-user').value;
  var p = document.getElementById('login-pass').value.trim();
  var err = document.getElementById('login-err');
  err.style.display='none';
  if(!u){err.style.display='block';err.textContent='User select karein!';return;}
  if(!USERS[u]){err.style.display='block';err.textContent='User nahi mila!';return;}
  if(USERS[u].pass !== p){
    err.style.display='block';
    err.textContent='Galat password! Try: '+USERS[u].pass;
    return;
  }
  currentUser = {id:u, name:USERS[u].name, role:USERS[u].role, color:USERS[u].color, route:USERS[u].route};
  localStorage.setItem('abbas-user', JSON.stringify(currentUser));
  startApp();
}

function doLogout(){
  localStorage.removeItem('abbas-user');
  currentUser=null;
  document.getElementById('login-page').style.display='flex';
  document.getElementById('app-page').style.display='none';
}

function startApp(){
  document.getElementById('login-page').style.display='none';
  document.getElementById('app-page').style.display='block';
  // Set user info
  var av=document.getElementById('u-avatar');
  var un=document.getElementById('u-name');
  var ur=document.getElementById('u-role');
  av.textContent=currentUser.name[0];
  av.className='user-avatar '+(currentUser.id==='admin'?'admin':'mobile');
  un.textContent=currentUser.name;
  ur.textContent=currentUser.role;

// ══════════════════════════════════
function setupAC(inputId, listId){
  var inp=document.getElementById(inputId);
  var list=document.getElementById(listId);
  if(!inp||!list) return;
  inp.addEventListener('input',function(){
    var val=inp.value.trim().toLowerCase();
    if(!val){list.className='ac-list';return;}
    var matches=customers.filter(function(c){return c.name.toLowerCase().includes(val);});
    if(!matches.length){list.className='ac-list';return;}
    list.innerHTML=matches.map(function(c){
      return'<div class="ac-item" onclick="selectAC(\''+inputId+'\',\''+listId+'\',\''+c.name+'\',\''+c.phone+'\')">'
        +'<strong>'+c.name+'</strong>'+(c.phone?' · '+c.phone:'')+'<br>'
        +(c.balance>0?'<span style="color:var(--amber);font-size:11px;">Balance: Rs '+fmt(c.balance)+'</span>':'')
      +'</div>';
    }).join('');
    list.className='ac-list show';
  });
  document.addEventListener('click',function(e){if(!inp.contains(e.target)&&!list.contains(e.target))list.className='ac-list';});
}

function selectAC(inputId, listId, name, phone){
  document.getElementById(inputId).value=name;
  document.getElementById(listId).className='ac-list';
  var cust=customers.find(function(c){return c.name===name;});
  // Auto fill phone
  var phoneEl=document.getElementById(inputId.replace('cname','phone'));
  if(phoneEl&&phone) phoneEl.value=phone;
  // Auto fill route from customer
  var routeEl=document.getElementById('o-route');
  if(routeEl&&cust&&cust.route) routeEl.value=cust.route;
  // Check balance - auto fill old balance
  if(cust&&cust.balance>0){
    var oldEl=document.getElementById('o-old');
    if(oldEl) oldEl.value=cust.balance;
    if(typeof calcBT==='function') calcBT();
  }
}

function saveCustomerIfNew(name, phone, route){
  if(!name) return;
  var ex=customers.find(function(c){return c.name.toLowerCase()===name.toLowerCase();});
  if(!ex){
    var id=Date.now();
    db.ref('customers/'+id).set({id:id,name:name,phone:phone||'',route:route||'',balance:0,createdAt:new Date().toISOString()});
  } else {
    // Update phone/route if empty
    var updates={};
    if(phone&&!ex.phone) updates.phone=phone;
    if(route&&!ex.route) updates.route=route;
    if(Object.keys(updates).length>0) db.ref('customers/'+ex.id).update(updates);
  }
}

function openApprove(id, type){
  var p=pendingEntries.find(function(x){return x.id===id;});
  if(!p) return;
  approveId=id; approveType=type;
  var ihtml=p.items?p.items.map(function(it){return'<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;"><span>'+it.name+'</span><span style="font-weight:700;">'+it.qty+' × Rs '+it.rate+' = Rs '+fmt(it.total)+'</span></div>';}).join(''):'';
  document.getElementById('approve-body').innerHTML=
    '<div style="background:var(--card2);border-radius:8px;padding:10px;margin-bottom:10px;">'
      +'<div style="font-size:14px;font-weight:700;">'+p.cname+'</div>'
      +'<div style="font-size:12px;color:var(--muted);">'+p.type+' · '+USERS[p.addedBy]?.name+'</div>'
    +'</div>'

    +'<div style="background:var(--blue);color:#0f172a;border-radius:8px;padding:10px;display:flex;justify-content:space-between;margin-top:8px;font-weight:700;"><span>Total</span><span>Rs '+fmt(p.grandTotal||p.amount||0)+'</span></div>';
  document.getElementById('approve-ov').className='ov center show';
}

function closeApprove(){document.getElementById('approve-ov').className='ov center';approveId=null;}

function approveEntry(){
  var p=pendingEntries.find(function(x){return x.id===approveId;});
  if(!p){closeApprove();return;}
  p.approved=true;p.approvedBy='admin';p.approvedAt=new Date().toISOString();
  if(p.type==='Order'){
    dbB.ref('bills/'+p.id).set(p);
  } else if(p.type==='Wasoli'){
    dbB.ref('wasoli/'+p.id).set(p);
    // Update customer balance
    updateCustomerBalance(p.cname, -p.amount);
  }
  db.ref('pending/'+approveId).remove();
  closeApprove();
  alert('✅ Approve ho gaya!');
}

function rejectDirect(id){
  if(!confirm('Reject karein?')) return;
  db.ref('pending/'+id).remove();
}

function rejectEntry(){
  if(!confirm('Reject karein?')) return;
  db.ref('pending/'+approveId).remove();
  closeApprove();
}

function openPendingDetail(id){
  var p=pendingEntries.find(function(x){return x.id===id;});
  if(p) openApprove(id, p.type);
}

function updateCustomerBalance(name, change){
  var c=customers.find(function(x){return x.name===name;});
  if(c) db.ref('customers/'+c.id).update({balance:Math.max(0,(c.balance||0)+change)});
}

function calcBT(){
  var it=0;Object.keys(selectedItems).forEach(function(pid){var p=products.find(function(x){return x.id==pid;});if(p){var r=selectedRates[pid]||p.rate;it+=selectedItems[pid]*r;}});

}

  var items=[],it=0;

  if(direct){

  var name=document.getElementById('g-name').value.trim();
  var qty=parseFloat(document.getElementById('g-qty').value)||0;

  var low=parseFloat(document.getElementById('g-low').value)||10;

  else{var id=Date.now();dbL.ref('godam/'+id).set({id:id,name:name,stock:qty,unit:unit,low:low,history:[{type:'in',qty:qty,date:new Date().toISOString().split('T')[0],note:note||'Opening'}]});}
  ['g-name','g-qty','g-low','g-note'].forEach(function(i){document.getElementById(i).value='';});

  document.body.appendChild(sh);
}
function closeJama(){var el=document.getElementById('jama-ov');if(el&&el.parentElement)el.parentElement.remove();jamaId=null;}
function saveJama(){
  var p=godamStock.find(function(x){return x.id===jamaId;});if(!p){closeJama();return;}
  var qty=parseFloat(document.getElementById('jama-qty').value);
  if(!qty||qty<=0){alert('Quantity likhein!');return;}
  var h=p.history||[];h.unshift({type:'in',qty:qty,date:new Date().toISOString().split('T')[0],note:document.getElementById('jama-note').value.trim()});
  dbL.ref('godam/'+p.id).update({stock:p.stock+qty,history:h});

}

  hc.innerHTML='<div class="dash-grid" style="grid-template-columns:1fr 1fr;">'

function addH(type,d){
  if(!hisabData[d]) hisabData[d]={wasoli:[],kharcha:[],company:[]};
  var entry={id:Date.now()};
  if(type==='wasoli'){var n=document.getElementById('hw-n').value.trim();var a=parseFloat(document.getElementById('hw-a').value);if(!n||!a){alert('Fill required!');return;}entry.name=n;entry.amount=a;entry.collector=document.getElementById('hw-c').value.trim();entry.method=document.getElementById('hw-m').value;hisabData[d].wasoli.push(entry);['hw-n','hw-a','hw-c'].forEach(function(i){document.getElementById(i).value='';});}
  else if(type==='kharcha'){var n=document.getElementById('hk-n').value.trim();var a=parseFloat(document.getElementById('hk-a').value);if(!n||!a){alert('Fill!');return;}entry.name=n;entry.amount=a;hisabData[d].kharcha.push(entry);['hk-n','hk-a'].forEach(function(i){document.getElementById(i).value='';});}
  else if(type==='company'){var n=document.getElementById('hc-n').value.trim();var a=parseFloat(document.getElementById('hc-a').value);if(!n||!a){alert('Fill!');return;}entry.name=n;entry.amount=a;entry.method=document.getElementById('hc-m').value;hisabData[d].company.push(entry);['hc-n','hc-a'].forEach(function(i){document.getElementById(i).value='';});}
  saveHisab();renderHisabContent(d);
}

function delH(type,id,d){hisabData[d][type]=hisabData[d][type].filter(function(e){return e.id!==id;});saveHisab();renderHisabContent(d);}

function printHisabReport(){

  if(hd.company.length) win.document.write('<h2 style="color:#1d4ed8;">🏢 Company</h2><table><thead><tr><th>Company</th><th>Tarika</th><th style="text-align:right;">Amount</th></tr></thead><tbody>'+hd.company.map(function(e){return'<tr><td>'+e.name+'</td><td>'+e.method+'</td><td style="text-align:right;color:#1d4ed8;font-weight:700;">Rs '+fmt(e.amount)+'</td></tr>';}).join('')+'<tr style="background:#eff6ff;font-weight:700;"><td colspan="2">Total</td><td style="text-align:right;color:#1d4ed8;">Rs '+fmt(tc)+'</td></tr></tbody></table>');
  win.document.write('<div class="sum"><div class="sr"><span>💰 Wasoli</span><span style="color:#15803d;">Rs '+fmt(tw)+'</span></div><div class="sr"><span>💸 Kharcha</span><span style="color:#dc2626;">Rs '+fmt(tk)+'</span></div><div class="sr"><span>🏢 Company</span><span style="color:#1d4ed8;">Rs '+fmt(tc)+'</span></div><div class="sr"><span>'+(net>=0?'✅ Faida':'❌ Nuqsan')+'</span><span style="color:'+(net>=0?'#15803d':'#dc2626')+';">Rs '+fmt(Math.abs(net))+'</span></div></div>');

var lineCount=0;
function addLine(){lineCount++;var lc2=lineCount;var cont=document.getElementById('lc');if(!cont)return;var div=document.createElement('div');div.style.cssText='background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;';div.id='lc-'+lc2;div.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><span style="background:var(--blue);color:#0f172a;font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px;">Line '+lc2+'</span><span style="background:var(--card);border:1px solid var(--orange);color:var(--orange);font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;" id="lt-'+lc2+'">0</span></div><div id="pr-'+lc2+'"></div><button onclick="addProd('+lc2+')" style="width:100%;padding:6px;background:var(--card);border:1px dashed var(--border);border-radius:7px;color:var(--muted);font-size:12px;cursor:pointer;">＋ Product</button>';cont.appendChild(div);addProd(lc2);}
function addProd(ln){var c=document.getElementById('pr-'+ln);if(!c)return;var row=document.createElement('div');row.style.cssText='display:grid;grid-template-columns:1fr 60px 28px;gap:6px;align-items:center;margin-bottom:6px;';row.innerHTML='<input type="text" placeholder="Product..." style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 8px;border-radius:7px;font-size:13px;outline:none;" oninput="calcLT('+ln+')">'+'<input type="number" placeholder="Qty" min="0" style="background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 6px;border-radius:7px;font-size:13px;outline:none;text-align:center;" oninput="calcLT('+ln+')">'+'<button style="background:rgba(248,113,113,0.15);color:var(--red);border:none;border-radius:7px;width:28px;height:28px;cursor:pointer;font-size:13px;" onclick="this.parentElement.remove();calcLT('+ln+')">✕</button>';c.appendChild(row);}
function calcLT(ln){var t=0;var c=document.getElementById('pr-'+ln);if(c)c.querySelectorAll('div').forEach(function(r){var ins=r.querySelectorAll('input');if(ins.length>=2)t+=parseFloat(ins[1].value)||0;});var lt=document.getElementById('lt-'+ln);if(lt)lt.textContent=t;}

function saveSheet(){
  var driver=document.getElementById('l-drv').value.trim();if(!driver){alert('Driver naam zaroor!');return;}
  var lines=[],total=0;
  for(var i=1;i<=lineCount;i++){var el=document.getElementById('lc-'+i);if(!el)continue;var prods=[];el.querySelectorAll('div').forEach(function(r){var ins=r.querySelectorAll('input');if(ins.length>=2){var n=ins[0].value.trim();var q=parseFloat(ins[1].value)||0;if(n&&q>0){prods.push({name:n,qty:q});total+=q;}}});if(prods.length>0)lines.push({lineNum:i,products:prods});}
  if(!lines.length){alert('Ek product add karein!');return;}
  var id=Date.now();
  dbL.ref('sheets/'+id).set({id:id,driver:driver,vehicle:document.getElementById('l-veh').value.trim(),route:document.getElementById('l-rte').value.trim(),datetime:document.getElementById('l-dt').value,lines:lines,totalItems:total,savedAt:new Date().toISOString(),addedBy:currentUser.id});
  lines.forEach(function(l){l.products.forEach(function(p){var g=godamStock.find(function(x){return x.name.toLowerCase()===p.name.toLowerCase();});if(g){var h=g.history||[];h.unshift({type:'out',qty:p.qty,date:new Date().toISOString().split('T')[0],note:'Gadi: '+driver});dbL.ref('godam/'+g.id).update({stock:g.stock-p.qty,history:h});}});});
  document.getElementById('lf').className='form-box';lineCount=0;document.getElementById('lc').innerHTML='';
  alert('✅ Sheet save!');addLine();
}

function renderSheetsList(){
  var list=document.getElementById('sheets-list');if(!list)return;
  if(!sheets.length){list.innerHTML='<div class="empty"><div class="empty-icon">🚚</div><div>Koi sheet nahi</div></div>';return;}
  list.innerHTML=sheets.slice(0,15).map(function(s){
    var dt=s.datetime?new Date(s.datetime).toLocaleDateString('en-PK',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
    return'<div class="ic" style="margin-bottom:8px;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><div><div class="ic-title">🚗 '+s.driver+(s.vehicle?' · '+s.vehicle:'')+'</div><div class="ic-meta">'+(s.route?s.route+' · ':'')+dt+'</div></div><span class="badge o">'+s.totalItems+' items</span></div><div class="ic-btns"><button class="btn ghost" style="padding:5px 10px;font-size:12px;" onclick="delSheet('+s.id+')">🗑 Delete</button></div></div>';
  }).join('');
}
function delSheet(id){if(!confirm('Delete?'))return;dbL.ref('sheets/'+id).remove();}
