<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e293b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ABBAS">
<title>ABBAS — Business Management System</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#0f172a;
  --card:#1e293b;
  --card2:#263348;
  --border:#334155;
  --text:#f1f5f9;
  --muted:#94a3b8;
  --green:#22d3a0;
  --red:#f87171;
  --blue:#60a5fa;
  --amber:#fbbf24;
  --purple:#a78bfa;
  --orange:#fb923c;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

/* SIDEBAR */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--card);border-right:1px solid var(--border);z-index:100;display:flex;flex-direction:column;transition:transform 0.3s;}
.sidebar.hidden{transform:translateX(-220px);}
.logo{padding:20px 16px;border-bottom:1px solid var(--border);}
.logo h1{font-size:20px;font-weight:800;color:var(--text);}
.logo h1 span{color:var(--green);}
.logo p{font-size:11px;color:var(--muted);margin-top:2px;}
.nav{flex:1;padding:12px 8px;overflow-y:auto;}
.nav-section{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:8px 8px 4px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:2px;transition:all 0.15s;}
.nav-item:hover{background:var(--card2);color:var(--text);}
.nav-item.active{background:var(--green);color:#0f172a;font-weight:700;}
.nav-item .ni{font-size:18px;width:22px;text-align:center;}
.sidebar-footer{padding:12px;border-top:1px solid var(--border);}
.sync-status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--amber);}
.sync-dot.on{background:var(--green);}
.sync-dot.off{background:var(--red);}

/* MAIN */
.main{margin-left:220px;min-height:100vh;transition:margin 0.3s;}
.main.full{margin-left:0;}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;}
.menu-btn{background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px;}
.topbar-title{font-size:16px;font-weight:700;flex:1;}
.topbar-date{font-size:12px;color:var(--muted);}
.content{padding:20px;}

/* DASHBOARD */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px;}
.dash-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;position:relative;overflow:hidden;}
.dash-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.dash-card.green::before{background:var(--green);}
.dash-card.red::before{background:var(--red);}
.dash-card.blue::before{background:var(--blue);}
.dash-card.amber::before{background:var(--amber);}
.dash-card.purple::before{background:var(--purple);}
.dash-card.orange::before{background:var(--orange);}
.dc-icon{font-size:22px;margin-bottom:8px;}
.dc-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:4px;}
.dc-val{font-size:20px;font-weight:700;}
.dc-val.green{color:var(--green);}
.dc-val.red{color:var(--red);}
.dc-val.blue{color:var(--blue);}
.dc-val.amber{color:var(--amber);}
.dc-val.purple{color:var(--purple);}
.dc-val.orange{color:var(--orange);}
.dc-sub{font-size:12px;color:var(--muted);margin-top:4px;}

/* SECTION HEADER */
.sec-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.sec-header h2{font-size:18px;font-weight:700;}
.btn{padding:9px 16px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn.primary{background:var(--green);color:#0f172a;}
.btn.blue{background:var(--blue);color:#0f172a;}
.btn.red{background:var(--red);color:#0f172a;}
.btn.amber{background:var(--amber);color:#0f172a;}
.btn.purple{background:var(--purple);color:#0f172a;}
.btn.orange{background:var(--orange);color:#0f172a;}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--border);}
.btn:hover{opacity:0.9;}

/* FORM */
.form-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;display:none;}
.form-box.show{display:block;}
.form-grid{display:grid;gap:12px;margin-bottom:12px;}
.form-grid.g2{grid-template-columns:1fr 1fr;}
.form-grid.g3{grid-template-columns:1fr 1fr 1fr;}
.form-grid.g4{grid-template-columns:1fr 1fr 1fr 1fr;}
.fld{display:flex;flex-direction:column;gap:4px;}
.fld label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.4px;}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-size:14px;font-family:inherit;outline:none;}
.fld input:focus,.fld select:focus{border-color:var(--green);}
.fld input::placeholder{color:var(--muted);}
select option{background:var(--card);}

/* CARDS/LISTS */
.item-list{display:flex;flex-direction:column;gap:8px;}
.item-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center;}
.item-card:hover{border-color:var(--border);}
.ic-left .ic-title{font-size:14px;font-weight:600;}
.ic-left .ic-meta{font-size:12px;color:var(--muted);margin-top:3px;}
.ic-right{display:flex;align-items:center;gap:10px;}
.ic-amt{font-size:15px;font-weight:700;}
.ic-amt.green{color:var(--green);}
.ic-amt.red{color:var(--red);}
.ic-amt.blue{color:var(--blue);}
.ic-amt.amber{color:var(--amber);}
.ic-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px;}
.ic-del:hover{color:var(--red);}

/* BADGE */
.badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
.badge.green{background:rgba(34,211,160,0.15);color:var(--green);}
.badge.red{background:rgba(248,113,113,0.15);color:var(--red);}
.badge.blue{background:rgba(96,165,250,0.15);color:var(--blue);}
.badge.amber{background:rgba(251,191,36,0.15);color:var(--amber);}
.badge.orange{background:rgba(251,146,60,0.15);color:var(--orange);}
.badge.purple{background:rgba(167,139,250,0.15);color:var(--purple);}

/* BILL ITEMS */
.bill-item-row{display:grid;grid-template-columns:1fr 70px 80px 30px;gap:8px;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.bill-item-row:last-child{border-bottom:none;}
.bir-inp{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 8px;border-radius:7px;font-size:13px;text-align:center;width:100%;}
.bir-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;}
.bir-del:hover{color:var(--red);}

/* PROD GRID */
.cat-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;scrollbar-width:none;}
.cat-scroll::-webkit-scrollbar{display:none;}
.cat-btn{padding:6px 14px;background:var(--card2);border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;}
.cat-btn.active{background:var(--blue);border-color:var(--blue);color:#0f172a;}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:12px;}
.prod-tile{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;position:relative;transition:all 0.15s;}
.prod-tile:hover{border-color:var(--blue);}
.prod-tile.sel{border-color:var(--blue);background:var(--card2);}
.pt-badge{position:absolute;top:6px;right:6px;background:var(--blue);color:#0f172a;font-size:10px;font-weight:800;width:18px;height:18px;border-radius:50%;display:none;align-items:center;justify-content:center;}
.prod-tile.sel .pt-badge{display:flex;}
.pt-name{font-size:13px;font-weight:700;margin-bottom:4px;}
.pt-cat{font-size:11px;color:var(--muted);margin-bottom:6px;}
.pt-rate{font-size:15px;font-weight:800;color:var(--blue);}

/* LINE CARD */
.line-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;}
.line-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.line-badge{background:var(--blue);color:#0f172a;font-size:12px;font-weight:800;padding:4px 12px;border-radius:20px;}
.line-total{background:var(--card);border:1px solid var(--orange);color:var(--orange);font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;}
.prod-row{display:grid;grid-template-columns:1fr 70px 32px;gap:6px;align-items:center;margin-bottom:7px;}
.prod-row input[type=text]{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px;outline:none;width:100%;}
.prod-row input[type=text]:focus{border-color:var(--orange);}
.prod-row input[type=number]{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 6px;border-radius:8px;font-size:13px;outline:none;text-align:center;width:100%;}
.prod-row input[type=number]:focus{border-color:var(--orange);}
.btn-rem-p{background:rgba(248,113,113,0.15);color:var(--red);border:none;border-radius:7px;width:32px;height:32px;cursor:pointer;font-size:14px;}
.btn-add-p{width:100%;padding:7px;background:var(--card);border:1px dashed var(--border);border-radius:8px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;margin-top:4px;}
.btn-add-p:hover{border-color:var(--blue);color:var(--blue);}
.btn-add-line{width:100%;padding:10px;background:var(--card);border:1.5px dashed var(--orange);border-radius:10px;color:var(--orange);font-size:13px;font-weight:700;cursor:pointer;margin:10px 0 12px;}

/* GODAM */
.stock-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;border-left:4px solid var(--green);}
.stock-card.low{border-left-color:var(--amber);}
.stock-card.out{border-left-color:var(--red);background:rgba(248,113,113,0.05);}
.sc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.sc-name{font-size:15px;font-weight:700;}
.sc-stock{text-align:right;}
.sc-num{font-size:22px;font-weight:900;color:var(--green);}
.sc-num.low{color:var(--amber);}
.sc-num.out{color:var(--red);}
.sc-unit{font-size:11px;color:var(--muted);}
.sc-btns{display:flex;gap:7px;}

/* OVERLAY */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:flex-end;justify-content:center;}
.ov.show{display:flex;}
.ov.center{align-items:center;}
.sheet{background:var(--card);border-radius:20px 20px 0 0;padding:22px;width:100%;max-width:520px;border-top:1px solid var(--border);}
.sheet.tall{max-height:85vh;overflow-y:auto;}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:14px;}
.info-box{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:13px;color:var(--muted);line-height:1.9;margin-bottom:12px;}
.info-box strong{color:var(--text);}
.sheet-inp{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:11px 13px;border-radius:9px;font-size:15px;outline:none;margin-bottom:10px;font-family:inherit;}
.sheet-inp:focus{border-color:var(--green);}
.sheet-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px;}
.sbc{padding:12px;background:var(--card2);border:1px solid var(--border);border-radius:9px;font-size:14px;cursor:pointer;color:var(--text);font-weight:600;}

/* MODAL */
.modal-wrap{background:var(--card);border-radius:16px;width:95%;max-width:520px;overflow:hidden;border:1px solid var(--border);}
.modal-head{padding:16px 18px;border-bottom:1px solid var(--border);}
.modal-head h2{font-size:17px;font-weight:800;}
.modal-body{padding:16px 18px;max-height:60vh;overflow-y:auto;}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}

/* HISAB */
.hisab-sec{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:14px;}
.hisab-sec-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.hisab-sec-head h3{font-size:14px;font-weight:700;}
.hisab-entry{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);}
.hisab-entry:last-child{border-bottom:none;}
.he-left .he-name{font-size:13px;font-weight:600;}
.he-left .he-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.he-amt{font-size:14px;font-weight:700;}

/* TOTALS */
.total-bar{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
.total-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid var(--border);}
.total-row:last-child{border-bottom:none;font-size:16px;font-weight:700;}
.tr-lbl{color:var(--muted);}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-icon{font-size:40px;margin-bottom:10px;}
.empty-text{font-size:14px;}

/* RESPONSIVE */
@media(max-width:768px){
  .sidebar{transform:translateX(-220px);}
  .sidebar.show{transform:translateX(0);}
  .main{margin-left:0;}
  .form-grid.g3{grid-template-columns:1fr 1fr;}
  .form-grid.g4{grid-template-columns:1fr 1fr;}
  .dash-grid{grid-template-columns:1fr 1fr;}
}
.overlay-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99;}
.overlay-bg.show{display:block;}
</style>
</head>
<body>

<!-- SIDEBAR OVERLAY -->
<div class="overlay-bg" id="overlay-bg" onclick="toggleSidebar()"></div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="logo">
    <h1>ABBAS <span>BMS</span></h1>
    <p>Business Management System</p>
  </div>
  <div class="nav">
    <div class="nav-section">Main</div>
    <div class="nav-item active" id="nav-dashboard" onclick="goTo('dashboard')"><span class="ni">📊</span> Dashboard</div>
    <div class="nav-section">Modules</div>
    <div class="nav-item" id="nav-wasoli" onclick="goTo('wasoli')"><span class="ni">💰</span> Wasoli</div>
    <div class="nav-item" id="nav-billing" onclick="goTo('billing')"><span class="ni">🧾</span> Billing</div>
    <div class="nav-item" id="nav-loading" onclick="goTo('loading')"><span class="ni">🚚</span> Loading Sheet</div>
    <div class="nav-item" id="nav-godam" onclick="goTo('godam')"><span class="ni">🏭</span> Godam Stock</div>
    <div class="nav-item" id="nav-hisab" onclick="goTo('hisab')"><span class="ni">📅</span> Daily Hisab</div>
    <div class="nav-section">Settings</div>
    <div class="nav-item" id="nav-products" onclick="goTo('products')"><span class="ni">📦</span> Products</div>
  </div>
  <div class="sidebar-footer">
    <div class="sync-status"><div class="sync-dot" id="sync-dot"></div><span id="sync-text">Connecting...</span></div>
  </div>
</div>

<!-- MAIN -->
<div class="main" id="main">
  <div class="topbar">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <div class="topbar-title" id="page-title">Dashboard</div>
    <div class="topbar-date" id="topbar-date"></div>
  </div>
  <div class="content" id="content"></div>
</div>

<!-- JAMA MODAL -->
<div class="ov" id="jama-ov">
  <div class="sheet">
    <h3>➕ Stock Jama Karein</h3>
    <div class="info-box" id="jama-info"></div>
    <input class="sheet-inp" type="number" id="jama-qty" placeholder="Quantity...">
    <input class="sheet-inp" type="text" id="jama-note" placeholder="Note / Supplier...">
    <div class="sheet-btns">
      <button class="sbc" onclick="closeJama()">Cancel</button>
      <button class="btn primary" onclick="saveJama()">✓ Jama Karein</button>
    </div>
  </div>
</div>

<!-- WA MODAL -->
<div class="ov" id="wa-ov">
  <div class="sheet">
    <h3>📱 WhatsApp Bill</h3>
    <div class="info-box" id="wa-msg" style="color:var(--green);"></div>
    <div class="sheet-btns">
      <button class="sbc" onclick="closeWa()">Cancel</button>
      <button class="btn primary" onclick="sendWa()">✓ Send Karein</button>
    </div>
  </div>
</div>

<!-- BILL DETAIL MODAL -->
<div class="ov center" id="bd-ov">
  <div class="modal-wrap">
    <div class="modal-head" style="display:flex;justify-content:space-between;align-items:center;">
      <h2>🧾 Bill Detail</h2>
      <button class="ic-del" onclick="closeBD()">✕</button>
    </div>
    <div class="modal-body" id="bd-body"></div>
    <div class="modal-foot">
      <button class="sbc" onclick="closeBD()">✕ Band</button>
      <button class="btn primary" onclick="openWaC()">📱 WhatsApp</button>
      <button class="btn purple" onclick="printBill()">🖨️ Print</button>
    </div>
  </div>
</div>

<!-- LOADING DETAIL MODAL -->
<div class="ov center" id="ld-ov">
  <div class="modal-wrap">
    <div class="modal-head" style="display:flex;justify-content:space-between;align-items:center;">
      <h2>🚚 Loading Detail</h2>
      <button class="ic-del" onclick="closeLD()">✕</button>
    </div>
    <div class="modal-body" id="ld-body"></div>
    <div class="modal-foot">
      <button class="sbc" onclick="closeLD()">✕ Band</button>
      <button class="btn purple" onclick="printLoading()">🖨️ Print</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════
// FIREBASE INIT
// ══════════════════════════════════════
const fb1 = firebase.initializeApp({databaseURL:"https://master-loading-default-rtdb.firebaseio.com/"}, 'loading');
const fb2 = firebase.initializeApp({databaseURL:"https://master-billing-1b88b-default-rtdb.firebaseio.com/"}, 'billing');
const dbL = firebase.database(fb1);
const dbB = firebase.database(fb2);

var products=[], bills=[], sheets=[], godamStock=[];
var selectedItems={}, lineCount=0, currentCat='All';
var currentBillId=null, currentLdId=null, jamaId=null;
var hisabData=JSON.parse(localStorage.getItem('abbas-hisab')||'{}');
var currentPage='dashboard', currentHisabDate='';

// Sync status
dbB.ref('.info/connected').on('value',function(s){
  var d=document.getElementById('sync-dot');
  var t=document.getElementById('sync-text');
  if(s.val()){d.className='sync-dot on';t.textContent='Online';}
  else{d.className='sync-dot off';t.textContent='Offline';}
});

// Load data
dbB.ref('products').on('value',function(s){ products=[]; s.forEach(function(c){products.push(c.val());}); if(currentPage==='products') renderProducts(); if(currentPage==='billing') renderBillingForm(); });
dbB.ref('bills').on('value',function(s){ bills=[]; s.forEach(function(c){bills.unshift(c.val());}); bills.sort(function(a,b){return b.id-a.id;}); if(currentPage==='billing') renderBills(); if(currentPage==='dashboard') renderDashboard(); });
dbL.ref('sheets').on('value',function(s){ sheets=[]; s.forEach(function(c){sheets.unshift(c.val());}); sheets.sort(function(a,b){return b.id-a.id;}); if(currentPage==='loading') renderSheets(); if(currentPage==='dashboard') renderDashboard(); });
dbL.ref('godam').on('value',function(s){ godamStock=[]; s.forEach(function(c){godamStock.push(c.val());}); if(currentPage==='godam') renderGodam(); });
dbB.ref('wasoli').on('value',function(s){ /* wasoli in billing db */ });

// ══════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════
function fmt(n){return Math.round(n).toLocaleString();}
function fmtDT(dt){if(!dt)return'';var d=new Date(dt);return d.toLocaleDateString('en-PK',{day:'2-digit',month:'short',year:'numeric'})+' '+d.toLocaleTimeString('en-PK',{hour:'2-digit',minute:'2-digit'});}
function fmtD(d){if(!d)return'';return new Date(d).toLocaleDateString('en-PK',{day:'2-digit',month:'short',year:'numeric'});}

function toggleSidebar(){
  var sb=document.getElementById('sidebar');
  var ob=document.getElementById('overlay-bg');
  var isMobile=window.innerWidth<=768;
  if(isMobile){sb.classList.toggle('show');ob.classList.toggle('show');}
  else{sb.classList.toggle('hidden');document.getElementById('main').classList.toggle('full');}
}

function goTo(page){
  currentPage=page;
  document.querySelectorAll('.nav-item').forEach(function(el){el.classList.remove('active');});
  var ni=document.getElementById('nav-'+page);
  if(ni) ni.classList.add('active');
  var titles={dashboard:'Dashboard',wasoli:'Wasoli — Recovery',billing:'Billing',loading:'Loading Sheet',godam:'Godam Stock',hisab:'Daily Hisab',products:'Products'};
  document.getElementById('page-title').textContent=titles[page]||page;
  // close mobile sidebar
  if(window.innerWidth<=768){document.getElementById('sidebar').classList.remove('show');document.getElementById('overlay-bg').classList.remove('show');}
  var c=document.getElementById('content');
  c.innerHTML='';
  if(page==='dashboard') renderDashboard();
  else if(page==='wasoli') renderWasoli();
  else if(page==='billing') renderBilling();
  else if(page==='loading') renderLoading();
  else if(page==='godam') renderGodam();
  else if(page==='hisab') renderHisab();
  else if(page==='products') renderProducts();
}

function renderDashboard(){
  var today=new Date().toISOString().split('T')[0];
  var todayBills=bills.filter(function(b){return b.savedAt&&b.savedAt.startsWith(today);});
  var todaySale=todayBills.reduce(function(s,b){return s+(b.grandTotal||0);},0);
  var todaySheets=sheets.filter(function(s){return s.savedAt&&s.savedAt.startsWith(today);});
  var totalItems=todaySheets.reduce(function(s,x){return s+(x.totalItems||0);},0);
  var hd=hisabData[today]||{wasoli:[],kharcha:[],company:[]};
  var tw=hd.wasoli.reduce(function(s,e){return s+e.amount;},0);
  var tk=hd.kharcha.reduce(function(s,e){return s+e.amount;},0);
  var tc=hd.company.reduce(function(s,e){return s+e.amount;},0);
  var net=tw-tk-tc;
  var outStock=godamStock.filter(function(p){return p.stock<=0;}).length;
  var lowStock=godamStock.filter(function(p){return p.stock>0&&p.stock<=p.low;}).length;

  document.getElementById('content').innerHTML=
    '<div class="dash-grid">'
      +'<div class="dash-card green"><div class="dc-icon">💰</div><div class="dc-label">Aaj Ki Wasoli</div><div class="dc-val green">Rs '+fmt(tw)+'</div><div class="dc-sub">'+hd.wasoli.length+' entries</div></div>'
      +'<div class="dash-card blue"><div class="dc-icon">🧾</div><div class="dc-label">Aaj Ki Sale</div><div class="dc-val blue">Rs '+fmt(todaySale)+'</div><div class="dc-sub">'+todayBills.length+' bills</div></div>'
      +'<div class="dash-card orange"><div class="dc-icon">🚚</div><div class="dc-label">Aaj Ki Gadian</div><div class="dc-val orange">'+todaySheets.length+'</div><div class="dc-sub">'+totalItems+' total items</div></div>'
      +'<div class="dash-card red"><div class="dc-icon">💸</div><div class="dc-label">Aaj Ka Kharcha</div><div class="dc-val red">Rs '+fmt(tk)+'</div><div class="dc-sub"></div></div>'
      +'<div class="dash-card amber"><div class="dc-icon">🏢</div><div class="dc-label">Company Payment</div><div class="dc-val amber">Rs '+fmt(tc)+'</div><div class="dc-sub"></div></div>'
      +'<div class="dash-card '+(net>=0?'green':'red')+'"><div class="dc-icon">📊</div><div class="dc-label">Net Balance</div><div class="dc-val '+(net>=0?'green':'red')+'">Rs '+fmt(Math.abs(net))+'</div><div class="dc-sub">'+(net>=0?'✅ Faida':'❌ Nuqsan')+'</div></div>'
    +'</div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">'
      +'<div class="dash-card purple"><div class="dc-icon">📦</div><div class="dc-label">Total Products</div><div class="dc-val purple">'+products.length+'</div><div class="dc-sub">'+outStock+' out of stock · '+lowStock+' low</div></div>'
      +'<div class="dash-card amber"><div class="dc-icon">👥</div><div class="dc-label">Total Bills</div><div class="dc-val amber">'+bills.length+'</div><div class="dc-sub">'+sheets.length+' loading sheets</div></div>'
    +'</div>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;">'
      +'<button class="btn primary" onclick="goTo(\'wasoli\')">💰 Wasoli</button>'
      +'<button class="btn blue" onclick="goTo(\'billing\')">🧾 Naya Bill</button>'
      +'<button class="btn orange" onclick="goTo(\'loading\')">🚚 Loading Sheet</button>'
      +'<button class="btn ghost" onclick="goTo(\'hisab\')">📅 Hisab</button>'
    +'</div>';
}

var wasoliData=[];
dbB.ref('wasoli').on('value',function(s){wasoliData=[];s.forEach(function(c){wasoliData.unshift(c.val());});wasoliData.sort(function(a,b){return b.id-a.id;});if(currentPage==='wasoli')renderWasoli();});

function renderWasoli(){
  var today=new Date().toISOString().split('T')[0];
  var todayW=wasoliData.filter(function(w){return w.date===today;});
  var total=todayW.reduce(function(s,w){return s+w.amount;},0);
  var c=document.getElementById('content');
  c.innerHTML='<div class="sec-header"><h2>💰 Wasoli</h2><button class="btn primary" onclick="toggleF(\'wf\')">＋ Nai Wasoli</button></div>'
    +'<div class="form-box" id="wf">'
      +'<div class="form-grid g2"><div class="fld"><label>Customer Naam</label><input id="w-cname" placeholder="Ali Khan..."></div><div class="fld"><label>Amount (Rs)</label><input type="number" id="w-amt" placeholder="5000"></div></div>'
      +'<div class="form-grid g3"><div class="fld"><label>Wasoli Karne Wala</label><input id="w-col" placeholder="Ahmad..."></div><div class="fld"><label>Tarika</label><select id="w-meth"><option>Cash</option><option>Easypaisa</option><option>Bank Transfer</option></select></div><div class="fld"><label>Note</label><input id="w-note" placeholder="Note..."></div></div>'
      +'<button class="btn primary" onclick="saveWasoli()">✓ Save Karein</button>'
    +'</div>'
    +'<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;">'
      +'<div><div style="font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;">Aaj Ki Total Wasoli</div><div style="font-size:22px;font-weight:800;color:var(--green);">Rs '+fmt(total)+'</div></div>'
      +'<div style="text-align:right;"><div style="font-size:11px;color:var(--muted);">Entries</div><div style="font-size:22px;font-weight:800;">'+todayW.length+'</div></div>'
    +'</div>'
    +'<div class="item-list" id="wasoli-list"></div>';

}

function renderWasoliList(){
  var list=document.getElementById('wasoli-list');
  if(!list) return;
  if(!wasoliData.length){list.innerHTML='<div class="empty"><div class="empty-icon">💰</div><div class="empty-text">Koi wasoli nahi</div></div>';return;}
  list.innerHTML=wasoliData.map(function(w){
    return '<div class="item-card"><div class="ic-left"><div class="ic-title">'+w.cname+'</div><div class="ic-meta">'+(w.collector?'👤 '+w.collector+' · ':'')+w.method+' · '+fmtD(w.date)+(w.note?' · '+w.note:'')+'</div></div>'
      +'<div class="ic-right"><div class="ic-amt green">+Rs '+fmt(w.amount)+'</div><button class="ic-del" onclick="delWasoli('+w.id+')">✕</button></div></div>';
  }).join('');
}

function saveWasoli(){
  var cname=document.getElementById('w-cname').value.trim();
  var amt=parseFloat(document.getElementById('w-amt').value);
  if(!cname||!amt){alert('Naam aur amount zaroor bharein!');return;}
  var id=Date.now();
  dbB.ref('wasoli/'+id).set({id:id,cname:cname,amount:amt,collector:document.getElementById('w-col').value.trim(),method:document.getElementById('w-meth').value,note:document.getElementById('w-note').value.trim(),date:new Date().toISOString().split('T')[0],savedAt:new Date().toISOString()});
  ['w-cname','w-amt','w-col','w-note'].forEach(function(i){document.getElementById(i).value='';});

function delWasoli(id){if(!confirm('Delete?'))return;dbB.ref('wasoli/'+id).remove();}

function renderBilling(){
  var c=document.getElementById('content');
  c.innerHTML='<div class="sec-header"><h2>🧾 Billing</h2><button class="btn blue" onclick="toggleF(\'order-form\')">＋ Naya Order</button></div>'
    +'<div class="form-box" id="order-form">'
      +'<div class="form-grid g2"><div class="fld"><label>Customer Naam</label><input id="o-cname" placeholder="Ali Khan..."></div><div class="fld"><label>Phone</label><input type="tel" id="o-phone" placeholder="03001234567"></div></div>'
      +'<div class="form-grid g3"><div class="fld"><label>Salesman</label><input id="o-sales" placeholder="Ahmad..."></div><div class="fld"><label>Route</label><input id="o-route" placeholder="Hayatabad..."></div><div class="fld"><label>Purana Balance (Rs)</label><input type="number" id="o-old" placeholder="0" oninput="calcBillTotal()"></div></div>'
      +'<div id="cats-bar" class="cat-scroll"></div>'
      +'<div id="prod-grid-billing" class="prod-grid"></div>'
      +'<div id="bill-items-wrap" style="background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;"><div id="bill-items-list" style="color:var(--muted);font-size:13px;text-align:center;">Products click karein...</div></div>'
      +'<div class="total-bar"><div class="total-row"><span class="tr-lbl">Items Total:</span><span id="bt-items">Rs 0</span></div><div class="total-row" id="bt-old-row" style="display:none;"><span class="tr-lbl" style="color:var(--amber);">+ Purana Balance:</span><span id="bt-old" style="color:var(--amber);">Rs 0</span></div><div class="total-row"><span style="color:var(--blue);font-weight:700;">Grand Total:</span><span id="bt-grand" style="color:var(--blue);font-size:18px;">Rs 0</span></div></div>'
      +'<div class="fld" style="margin-bottom:10px;"><label>Note</label><input id="o-note" placeholder="Note..."></div>'
      +'<button class="btn blue" onclick="saveOrder()" style="width:100%;padding:13px;">✅ Bill Save Karein</button>'
    +'</div>'
    +'<div id="bills-list"></div>';
  renderBillingForm();
  renderBills();
}

function renderBillingForm(){
  var cats=['All'];
  products.forEach(function(p){if(p.cat&&cats.indexOf(p.cat)===-1)cats.push(p.cat);});
  var cb=document.getElementById('cats-bar');
  if(cb) cb.innerHTML=cats.map(function(c){return'<button class="cat-btn'+(c===currentCat?' active':'')+'" onclick="filterCat(\''+c+'\')" >'+c+'</button>';}).join('');
  var pg=document.getElementById('prod-grid-billing');
  if(!pg) return;
  var filtered=currentCat==='All'?products:products.filter(function(p){return p.cat===currentCat;});
  if(!filtered.length){pg.innerHTML='<div style="color:var(--muted);font-size:13px;grid-column:1/-1;">Koi product nahi — Products mein add karein</div>';return;}
  pg.innerHTML=filtered.map(function(p){
    var qty=selectedItems[p.id]||0;
    return'<div class="prod-tile'+(qty>0?' sel':'')+'" id="pt-'+p.id+'" onclick="toggleProd('+p.id+')">'
      +'<div class="pt-badge" id="pb-'+p.id+'">'+qty+'</div>'
      +'<div class="pt-name">'+p.name+'</div>'
      +'<div class="pt-cat">'+p.cat+'</div>'
      +'<div class="pt-rate">Rs '+p.rate+'</div>'
    +'</div>';
  }).join('');
}

function filterCat(cat){currentCat=cat;renderBillingForm();}

function toggleProd(pid){
  selectedItems[pid]=(selectedItems[pid]||0)+1;
  renderBillingForm();renderBillItems();calcBillTotal();
}

function renderBillItems(){
  var list=document.getElementById('bill-items-list');
  if(!list) return;
  var keys=Object.keys(selectedItems);
  if(!keys.length){list.innerHTML='<div style="color:var(--muted);font-size:13px;text-align:center;">Products click karein...</div>';return;}
  list.innerHTML=keys.map(function(pid){
    var p=products.find(function(x){return x.id==pid;});
    if(!p) return'';
    var qty=selectedItems[pid];
    return'<div class="bill-item-row">'
      +'<div><div style="font-size:13px;font-weight:600;">'+p.name+'</div><div style="font-size:11px;color:var(--muted);">Rs '+p.rate+'/'+p.unit+'</div></div>'
      +'<input class="bir-inp" type="number" min="1" value="'+qty+'" onchange="updateQty('+pid+',this.value)">'
      +'<div style="font-size:13px;font-weight:700;color:var(--blue);text-align:right;">Rs '+fmt(qty*p.rate)+'</div>'
      +'<button class="bir-del" onclick="removeItem('+pid+')">✕</button>'
    +'</div>';
  }).join('');
}

function updateQty(pid,val){var q=parseInt(val)||1;if(q<=0){removeItem(pid);return;}selectedItems[pid]=q;renderBillingForm();renderBillItems();calcBillTotal();}
function removeItem(pid){delete selectedItems[pid];renderBillingForm();renderBillItems();calcBillTotal();}

function calcBillTotal(){
  var it=0;
  Object.keys(selectedItems).forEach(function(pid){var p=products.find(function(x){return x.id==pid;});if(p)it+=selectedItems[pid]*p.rate;});
  var old=parseFloat(document.getElementById('o-old')?document.getElementById('o-old').value:0)||0;
  var grand=it+old;
  var bi=document.getElementById('bt-items');var bg=document.getElementById('bt-grand');var bor=document.getElementById('bt-old-row');var bo=document.getElementById('bt-old');
  if(bi)bi.textContent='Rs '+fmt(it);
  if(bg)bg.textContent='Rs '+fmt(grand);
  if(bor)bor.style.display=old>0?'flex':'none';
  if(bo)bo.textContent='Rs '+fmt(old);
}

function saveOrder(){
  var cname=document.getElementById('o-cname').value.trim();
  if(!cname){alert('Customer ka naam zaroor likhein!');return;}
  var keys=Object.keys(selectedItems);
  if(!keys.length){alert('Kam az kam ek product select karein!');return;}
  var items=[],it=0;
  keys.forEach(function(pid){var p=products.find(function(x){return x.id==pid;});if(p&&selectedItems[pid]>0){var t=selectedItems[pid]*p.rate;it+=t;items.push({prodId:pid,name:p.name,qty:selectedItems[pid],unit:p.unit,rate:p.rate,total:t,cat:p.cat||''});}});
  var old=parseFloat(document.getElementById('o-old').value)||0;
  var id=Date.now();
  dbB.ref('bills/'+id).set({id:id,cname:cname,phone:document.getElementById('o-phone').value.trim(),salesman:document.getElementById('o-sales').value.trim(),route:document.getElementById('o-route').value.trim(),note:document.getElementById('o-note').value.trim(),oldBalance:old,items:items,itemsTotal:it,grandTotal:it+old,savedAt:new Date().toISOString(),date:new Date().toLocaleDateString('en-PK',{day:'2-digit',month:'short',year:'numeric'})});
  selectedItems={};
  document.getElementById('order-form').className='form-box';
  alert('✅ Bill save ho gaya!');
}

function renderBills(){
  var list=document.getElementById('bills-list');
  if(!list) return;
  if(!bills.length){list.innerHTML='<div class="empty"><div class="empty-icon">🧾</div><div class="empty-text">Koi bill nahi</div></div>';return;}
  list.innerHTML=bills.map(function(b){
    return'<div class="item-card" style="flex-direction:column;align-items:stretch;">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'
        +'<div><div class="ic-title">👤 '+b.cname+'</div><div class="ic-meta">'+b.date+(b.salesman?' · '+b.salesman:'')+(b.route?' · '+b.route:'')+'</div></div>'
        +'<div class="ic-amt blue">Rs '+fmt(b.grandTotal)+'</div>'
      +'</div>'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap;">'
        +(b.phone?'<span class="badge blue">📞 '+b.phone+'</span>':'')
        +(b.oldBalance>0?'<span class="badge amber">⚠️ Old: Rs '+fmt(b.oldBalance)+'</span>':'')
        +'<span class="badge green">'+b.items.length+' items</span>'
      +'</div>'

      +'</div>'

}

function openBD(id){
  var b=bills.find(function(x){return x.id===id;});if(!b)return;
  currentBillId=id;
  var ihtml=b.items.map(function(it){return'<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px;"><div><div style="font-weight:600;">'+it.name+'</div><div style="font-size:12px;color:var(--muted);">'+it.qty+' '+it.unit+' × Rs '+it.rate+'</div></div><div style="font-weight:700;color:var(--blue);">Rs '+fmt(it.total)+'</div></div>';}).join('');

  document.getElementById('bd-ov').className='ov center show';
}

function closeBD(){document.getElementById('bd-ov').className='ov center';currentBillId=null;}

function buildWaMsg(b){var lines=b.items.map(function(it,i){return(i+1)+'. '+it.name+' ×'+it.qty+' = Rs '+fmt(it.total);}).join('\n');var msg='Assalam o Alaikum *'+b.cname+'*!\n\nBill:\n\n'+lines;if(b.oldBalance>0)msg+='\n\nPurana Balance: Rs '+fmt(b.oldBalance);msg+='\n\n*Grand Total: Rs '+fmt(b.grandTotal)+'*\n\nShukriya! 🙏';return msg;}

function openWaC(){var b=bills.find(function(x){return x.id===currentBillId;});if(!b)return;document.getElementById('wa-msg').innerHTML=buildWaMsg(b).replace(/\n/g,'<br>').replace(/\*(.*?)\*/g,'<strong>$1</strong>');document.getElementById('wa-ov').className='ov show';}
function qWa(id){currentBillId=id;openWaC();}
function closeWa(){document.getElementById('wa-ov').className='ov';}
function sendWa(){var b=bills.find(function(x){return x.id===currentBillId;});if(!b){closeWa();return;}var ph=b.phone.replace(/\D/g,'');var num=ph.startsWith('0')?'92'+ph.slice(1):'92'+ph;closeWa();window.open('https://wa.me/'+num+'?text='+encodeURIComponent(buildWaMsg(b)),'_blank');}
function printBill(){var b=bills.find(function(x){return x.id===currentBillId;});if(b)doPrintBill(b);}
function pBill(id){var b=bills.find(function(x){return x.id===id;});if(b)doPrintBill(b);}

· Printed: '+new Date().toLocaleString('en-PK')+'</div></body></html>');win.document.close();win.focus();setTimeout(function(){win.print();},500);}

function renderLoading(){

  c.innerHTML='<div class="sec-header"><h2>🚚 Loading Sheet</h2><button class="btn orange" onclick="toggleF(\'loading-form\')">＋ Nayi Sheet</button></div>'
    +'<div class="form-box" id="loading-form">'
      +'<div class="form-grid g2"><div class="fld"><label>Driver Naam</label><input id="l-driver" placeholder="Ahmad..."></div><div class="fld"><label>Gadi Number</label><input id="l-vehicle" placeholder="LEA-1234"></div></div>'
      +'<div class="form-grid g2"><div class="fld"><label>Route</label><input id="l-route" placeholder="Hayatabad..."></div><div class="fld"><label>Date & Time</label><input type="datetime-local" id="l-dt"></div></div>'
      +'<div class="fld" style="margin-bottom:12px;"><label>Note</label><input id="l-note" placeholder="Note..."></div>'
      +'<div id="lines-cont"></div>'
      +'<button class="btn-add-line" onclick="addLine()">＋ Nayi Line Add Karein</button>'
      +'<button class="btn orange" onclick="saveSheet()" style="width:100%;padding:13px;">✅ Sheet Save Karein</button>'
    +'</div>'
    +'<div id="sheets-list"></div>';
  var now=new Date();
  var ldt=document.getElementById('l-dt');
  if(ldt) ldt.value=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,16);
  lineCount=0;
  addLine();
  renderSheets();
}

function addLine(){
  lineCount++;
  var lc=lineCount;
  var cont=document.getElementById('lines-cont');
  if(!cont) return;
  var div=document.createElement('div');
  div.className='line-card';div.id='lc-'+lc;
  div.innerHTML='<div class="line-head"><span class="line-badge">📦 Line '+lc+'</span><span class="line-total" id="lt-'+lc+'">Total: 0</span></div>'
    +'<div id="pr-'+lc+'"></div>'
    +'<button class="btn-add-p" onclick="addProd('+lc+')">＋ Product Add Karein</button>';
  cont.appendChild(div);
  addProd(lc);
}

function addProd(ln){
  var c=document.getElementById('pr-'+ln);if(!c)return;
  var row=document.createElement('div');row.className='prod-row';
  row.innerHTML='<input type="text" placeholder="Product naam..." oninput="calcLT('+ln+')">'
    +'<input type="number" placeholder="Qty" min="0" oninput="calcLT('+ln+')">'
    +'<button class="btn-rem-p" onclick="remProd(this,'+ln+')">✕</button>';
  c.appendChild(row);
}

function remProd(btn,ln){var c=document.getElementById('pr-'+ln);if(c&&c.children.length>1){c.removeChild(btn.parentElement);calcLT(ln);}}
function calcLT(ln){var t=0;var c=document.getElementById('pr-'+ln);if(c)c.querySelectorAll('.prod-row').forEach(function(r){t+=parseFloat(r.querySelectorAll('input')[1].value)||0;});var lt=document.getElementById('lt-'+ln);if(lt)lt.textContent='Total: '+t;}

function saveSheet(){
  var driver=document.getElementById('l-driver').value.trim();
  if(!driver){alert('Driver naam zaroor likhein!');return;}
  var lines=[],total=0;
  for(var i=1;i<=lineCount;i++){var el=document.getElementById('lc-'+i);if(!el)continue;var prods=[];el.querySelectorAll('.prod-row').forEach(function(r){var n=r.querySelectorAll('input')[0].value.trim();var q=parseFloat(r.querySelectorAll('input')[1].value)||0;if(n&&q>0){prods.push({name:n,qty:q});total+=q;}});if(prods.length>0)lines.push({lineNum:i,products:prods});}
  if(!lines.length){alert('Kam az kam ek product add karein!');return;}
  var id=Date.now();
  var data={id:id,driver:driver,vehicle:document.getElementById('l-vehicle').value.trim(),route:document.getElementById('l-route').value.trim(),datetime:document.getElementById('l-dt').value,note:document.getElementById('l-note').value.trim(),lines:lines,totalItems:total,savedAt:new Date().toISOString()};

  // Deduct from godam
  lines.forEach(function(l){l.products.forEach(function(p){var g=godamStock.find(function(x){return x.name.toLowerCase()===p.name.toLowerCase();});if(g){var newH=g.history||[];newH.unshift({type:'out',qty:p.qty,date:new Date().toISOString().split('T')[0],note:'Gadi: '+driver});dbL.ref('godam/'+g.id).update({stock:g.stock-p.qty,history:newH});}});});

  dbL.ref('sheets/'+id).set(data);
  document.getElementById('loading-form').className='form-box';
  lineCount=0;document.getElementById('lines-cont').innerHTML='';
  alert('✅ Sheet save ho gayi! Godam se minus ho gaya!');
  addLine();
}

function renderSheets(){
  var list=document.getElementById('sheets-list');if(!list)return;
  if(!sheets.length){list.innerHTML='<div class="empty"><div class="empty-icon">🚚</div><div class="empty-text">Koi sheet nahi</div></div>';return;}
  list.innerHTML=sheets.map(function(s){
    return'<div class="item-card" style="flex-direction:column;align-items:stretch;margin-bottom:8px;">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'
        +'<div><div class="ic-title">🚗 '+s.driver+(s.vehicle?' · '+s.vehicle:'')+'</div><div class="ic-meta">'+(s.route?'🛣️ '+s.route+' · ':'')+fmtDT(s.datetime)+'</div></div>'
        +'<span class="badge orange">'+s.totalItems+' items</span>'
      +'</div>'
      +'<div style="display:flex;gap:7px;">'
        +'<button class="btn orange" style="flex:1;padding:8px;" onclick="openLD('+s.id+')">👁 Detail</button>'
        +'<button class="btn purple" style="flex:1;padding:8px;" onclick="pSheet('+s.id+')">🖨️ Print</button>'
        +'<button class="btn ghost" style="padding:8px 12px;" onclick="delSheet('+s.id+')">🗑</button>'
      +'</div>'
    +'</div>';
  }).join('');
}

function openLD(id){
  var s=sheets.find(function(x){return x.id===id;});if(!s)return;
  currentLdId=id;
  var ps={};s.lines.forEach(function(l){l.products.forEach(function(p){var k=p.name.toLowerCase();if(!ps[k])ps[k]={name:p.name,total:0};ps[k].total+=p.qty;});});
  var sumHtml=Object.keys(ps).map(function(k){return'<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px;"><span>'+ps[k].name+'</span><span class="badge orange">'+ps[k].total+'</span></div>';}).join('');
  var linesHtml=s.lines.map(function(l){var lt=l.products.reduce(function(x,p){return x+p.qty;},0);return'<div style="background:var(--card2);border-radius:10px;padding:10px;margin-bottom:8px;"><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--blue);margin-bottom:8px;"><span>Line '+l.lineNum+'</span><span>'+lt+' items</span></div>'+l.products.map(function(p){return'<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--border);"><span>'+p.name+'</span><span style="font-weight:700;">'+p.qty+'</span></div>';}).join('')+'</div>';}).join('');
  document.getElementById('ld-body').innerHTML='<div style="background:var(--card2);border-radius:10px;padding:12px;margin-bottom:12px;"><div style="font-size:15px;font-weight:700;">🚗 '+s.driver+(s.vehicle?' · '+s.vehicle:'')+'</div><div style="font-size:12px;color:var(--muted);margin-top:3px;">'+(s.route?'🛣️ '+s.route+' · ':'')+fmtDT(s.datetime)+'</div></div>'
    +'<div style="background:rgba(251,146,60,0.1);border:1px solid var(--orange);border-radius:10px;padding:12px;margin-bottom:12px;"><div style="font-size:12px;font-weight:700;color:var(--orange);margin-bottom:8px;">📊 PRODUCT SUMMARY</div>'+sumHtml+'</div>'
    +linesHtml
    +'<div style="background:var(--orange);border-radius:10px;padding:12px;text-align:center;"><div style="font-size:28px;font-weight:900;color:#0f172a;">'+s.totalItems+'</div><div style="color:#0f172a;font-weight:700;">Total Items</div></div>';
  document.getElementById('ld-ov').className='ov center show';
}

function closeLD(){document.getElementById('ld-ov').className='ov center';currentLdId=null;}
function printLoading(){var s=sheets.find(function(x){return x.id===currentLdId;});if(s)doPrintSheet(s);}
function pSheet(id){var s=sheets.find(function(x){return x.id===id;});if(s)doPrintSheet(s);}

function doPrintSheet(s){
  var ps={};s.lines.forEach(function(l){l.products.forEach(function(p){var k=p.name.toLowerCase();if(!ps[k])ps[k]={name:p.name,total:0};ps[k].total+=p.qty;});});
  var sumRows=Object.keys(ps).map(function(k){return'<tr><td>'+ps[k].name+'</td><td style="text-align:right;font-weight:800;color:#c2410c;">'+ps[k].total+'</td></tr>';}).join('');
  var linesHtml=s.lines.map(function(l){var lt=l.products.reduce(function(x,p){return x+p.qty;},0);return'<div style="border:1px solid #e5e7eb;border-radius:8px;padding:10px;margin-bottom:8px;"><div style="font-size:13px;font-weight:700;color:#1d4ed8;margin-bottom:6px;display:flex;justify-content:space-between;"><span>Line '+l.lineNum+'</span><span>'+lt+'</span></div>'+l.products.map(function(p){return'<div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid #f0f0f0;"><span>'+p.name+'</span><span style="font-weight:700;">'+p.qty+'</span></div>';}).join('')+'</div>';}).join('');
  var win=window.open('','_blank','width=800,height=700');
  win.document.write('<!DOCTYPE html><html><head><title>Loading Sheet</title><style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:Arial,sans-serif;padding:20px;}.top{background:linear-gradient(135deg,#c2410c,#ea580c);color:white;padding:14px;border-radius:10px;margin-bottom:14px;}.top h1{font-size:18px;font-weight:800;}table{width:100%;border-collapse:collapse;}th{background:#fff7ed;padding:7px;text-align:left;font-size:12px;color:#666;border-bottom:2px solid #fed7aa;}td{padding:7px;font-size:13px;border-bottom:1px solid #f0f0f0;}.grand{background:linear-gradient(135deg,#c2410c,#ea580c);color:white;border-radius:8px;padding:12px;text-align:center;margin-top:12px;}.grand .n{font-size:28px;font-weight:900;}.footer{text-align:center;margin-top:12px;font-size:11px;color:#999;}@media print{body{padding:8px;}}</style></head><body>');
  win.document.write('<div class="top"><h1>🚚 ABBAS — Loading Sheet</h1><p>Driver: '+s.driver+(s.vehicle?' · '+s.vehicle:'')+'</p><p>'+(s.route?'Route: '+s.route+' · ':'')+fmtDT(s.datetime)+'</p></div>');
  win.document.write('<div style="background:#fff7ed;border:2px solid #fdba74;border-radius:8px;padding:12px;margin-bottom:14px;"><div style="font-size:13px;font-weight:800;color:#c2410c;margin-bottom:8px;">📊 Product Summary</div><table><thead><tr><th>Product</th><th style="text-align:right;">Total</th></tr></thead><tbody>'+sumRows+'</tbody></table></div>');
  win.document.write('<div style="font-size:13px;font-weight:800;color:#666;margin-bottom:8px;">Line Details</div>'+linesHtml);
  win.document.write('<div class="grand"><div class="n">'+s.totalItems+'</div><div>Total Items Loaded</div></div>');
  win.document.write('<div class="footer">ABBAS BMS · Printed: '+new Date().toLocaleString('en-PK')+'</div></body></html>');
  win.document.close();win.focus();setTimeout(function(){win.print();},500);
}

function delSheet(id){if(!confirm('Delete?'))return;dbL.ref('sheets/'+id).remove();}

function renderGodam(){
  var low=godamStock.filter(function(p){return p.stock>0&&p.stock<=p.low;}).length;
  var out=godamStock.filter(function(p){return p.stock<=0;}).length;
  var c=document.getElementById('content');
  c.innerHTML='<div class="sec-header"><h2>🏭 Godam Stock</h2><button class="btn primary" onclick="toggleF(\'gf\')">＋ Stock Jama</button></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px;">'
      +'<div class="dash-card green"><div class="dc-label">Total Products</div><div class="dc-val green">'+godamStock.length+'</div></div>'
      +'<div class="dash-card amber"><div class="dc-label">Low Stock</div><div class="dc-val amber">'+low+'</div></div>'
      +'<div class="dash-card red"><div class="dc-label">Out of Stock</div><div class="dc-val red">'+out+'</div></div>'
    +'</div>'
    +'<div class="form-box" id="gf" style="border-color:rgba(34,211,160,0.3);">'
      +'<div class="form-grid g2"><div class="fld"><label>Product Naam</label><input id="g-name" placeholder="Anybite, O\'cake..."></div><div class="fld"><label>Quantity</label><input type="number" id="g-qty" placeholder="100"></div></div>'
      +'<div class="form-grid g3"><div class="fld"><label>Unit</label><select id="g-unit"><option>Carton</option><option>Box</option><option>Piece</option><option>Dozen</option><option>Kg</option></select></div><div class="fld"><label>Low Stock Alert</label><input type="number" id="g-low" placeholder="10"></div><div class="fld"><label>Note</label><input id="g-note" placeholder="Supplier..."></div></div>'
      +'<button class="btn primary" onclick="saveGodam()">✓ Stock Jama Karein</button>'
    +'</div>'
    +'<div id="godam-list"></div>';
  renderGodamList();
}

function renderGodamList(){
  var list=document.getElementById('godam-list');if(!list)return;
  if(!godamStock.length){list.innerHTML='<div class="empty"><div class="empty-icon">🏭</div><div class="empty-text">Koi product nahi</div></div>';return;}
  list.innerHTML=godamStock.map(function(p){
    var isOut=p.stock<=0,isLow=!isOut&&p.stock<=p.low;
    var cls=isOut?'out':isLow?'low':'';
    var nc=isOut?'out':isLow?'low':'';
    return'<div class="stock-card '+cls+'">'
      +'<div class="sc-top"><div><div class="sc-name">'+p.name+'</div><div style="display:flex;gap:6px;margin-top:4px;">'
        +(isOut?'<span class="badge red">⛔ Out</span>':isLow?'<span class="badge amber">⚠️ Low</span>':'<span class="badge green">✅ In Stock</span>')
        +'<span class="badge blue">Alert: '+p.low+'</span>'
      +'</div></div>'
      +'<div class="sc-stock"><div class="sc-num '+nc+'">'+p.stock+'</div><div class="sc-unit">'+p.unit+'</div></div></div>'
      +'<div class="sc-btns">'
        +'<button class="btn primary" style="padding:7px 12px;font-size:12px;" onclick="openJama('+p.id+')">➕ Jama</button>'
        +'<button class="btn ghost" style="padding:7px 12px;font-size:12px;" onclick="delGod('+p.id+')">🗑</button>'
      +'</div>'
    +'</div>';
  }).join('');
}

function saveGodam(){
  var name=document.getElementById('g-name').value.trim();
  var qty=parseFloat(document.getElementById('g-qty').value)||0;
  var unit=document.getElementById('g-unit').value;
  var low=parseFloat(document.getElementById('g-low').value)||10;
  var note=document.getElementById('g-note').value.trim();
  if(!name){alert('Naam zaroor likhein!');return;}
  var ex=godamStock.find(function(x){return x.name.toLowerCase()===name.toLowerCase();});
  if(ex){var h=ex.history||[];h.unshift({type:'in',qty:qty,date:new Date().toISOString().split('T')[0],note:note||'Stock jama'});dbL.ref('godam/'+ex.id).update({stock:ex.stock+qty,history:h});}
  else{var id=Date.now();dbL.ref('godam/'+id).set({id:id,name:name,stock:qty,unit:unit,low:low,history:[{type:'in',qty:qty,date:new Date().toISOString().split('T')[0],note:note||'Opening stock'}]});}
  ['g-name','g-qty','g-low','g-note'].forEach(function(i){document.getElementById(i).value='';});
  document.getElementById('gf').className='form-box';
}

function openJama(id){
  var p=godamStock.find(function(x){return x.id===id;});if(!p)return;
  jamaId=id;
  document.getElementById('jama-info').innerHTML='Product: <strong>'+p.name+'</strong><br>Stock: <strong style="color:var(--green)">'+p.stock+' '+p.unit+'</strong>';
  document.getElementById('jama-qty').value='';document.getElementById('jama-note').value='';
  document.getElementById('jama-ov').className='ov show';
}

function closeJama(){document.getElementById('jama-ov').className='ov';jamaId=null;}

function saveJama(){
  var p=godamStock.find(function(x){return x.id===jamaId;});if(!p){closeJama();return;}
  var qty=parseFloat(document.getElementById('jama-qty').value);
  if(!qty||qty<=0){alert('Quantity likhein!');return;}
  var h=p.history||[];h.unshift({type:'in',qty:qty,date:new Date().toISOString().split('T')[0],note:document.getElementById('jama-note').value.trim()||'Stock jama'});
  dbL.ref('godam/'+p.id).update({stock:p.stock+qty,history:h});
  closeJama();
}

function delGod(id){if(!confirm('Delete?'))return;dbL.ref('godam/'+id).remove();}

      +'<div class="hisab-sec-head"><h3 style="color:var(--blue);">🏢 Company Payment</h3><button class="btn blue" style="padding:6px 12px;font-size:12px;" onclick="toggleF(\'hf-c\')">＋ Add</button></div>'
      +'<div class="form-box" id="hf-c" style="border-radius:0;border:none;border-bottom:1px solid var(--border);margin:0;">'
        +'<div class="form-grid g3" style="padding:12px 14px 0;"><div class="fld"><label>Company</label><input id="hc-name" placeholder="Master Foods..."></div><div class="fld"><label>Amount</label><input type="number" id="hc-amt" placeholder="50000"></div><div class="fld"><label>Tarika</label><select id="hc-meth"><option>Cash</option><option>Cheque</option><option>Bank</option></select></div></div>'
        +'<div style="padding:0 14px 12px;"><button class="btn blue" onclick="addHisabEntry(\'company\')">✓ Add</button></div>'
      +'</div>'
      +(d.company.length?d.company.map(function(e){return'<div class="hisab-entry"><div class="he-left"><div class="he-name">'+e.name+'</div><div class="ic-meta">'+e.method+'</div></div><div style="display:flex;align-items:center;gap:8px;"><div class="he-amt" style="color:var(--blue);">-Rs '+fmt(e.amount)+'</div><button class="ic-del" onclick="delHisab(\'company\','+e.id+')">✕</button></div></div>';}).join(''):'<div style="padding:12px 16px;color:var(--muted);font-size:13px;">Koi payment nahi</div>')
    +'</div>';
}

function addHisabEntry(type){
  if(!hisabData[currentHisabDate]) hisabData[currentHisabDate]={wasoli:[],kharcha:[],company:[]};
  var d=hisabData[currentHisabDate];
  var entry={id:Date.now()};
  if(type==='wasoli'){
    var n=document.getElementById('hw-name').value.trim();var a=parseFloat(document.getElementById('hw-amt').value);
    if(!n||!a){alert('Naam aur amount zaroor bharein!');return;}
    entry.name=n;entry.amount=a;entry.collector=document.getElementById('hw-col').value.trim();entry.method=document.getElementById('hw-meth').value;
    d.wasoli.push(entry);
    ['hw-name','hw-amt','hw-col'].forEach(function(i){document.getElementById(i).value='';});
  } else if(type==='kharcha'){
    var n=document.getElementById('hk-name').value.trim();var a=parseFloat(document.getElementById('hk-amt').value);
    if(!n||!a){alert('Wajah aur amount zaroor bharein!');return;}
    entry.name=n;entry.amount=a;
    d.kharcha.push(entry);
    ['hk-name','hk-amt'].forEach(function(i){document.getElementById(i).value='';});
  } else if(type==='company'){
    var n=document.getElementById('hc-name').value.trim();var a=parseFloat(document.getElementById('hc-amt').value);
    if(!n||!a){alert('Company naam aur amount zaroor bharein!');return;}
    entry.name=n;entry.amount=a;entry.method=document.getElementById('hc-meth').value;
    d.company.push(entry);
    ['hc-name','hc-amt'].forEach(function(i){document.getElementById(i).value='';});
  }
  saveHisab();renderHisabContent();
  if(currentPage==='dashboard') renderDashboard();
}

function delHisab(type,id){
  if(!hisabData[currentHisabDate]) return;
  hisabData[currentHisabDate][type]=hisabData[currentHisabDate][type].filter(function(e){return e.id!==id;});
  saveHisab();renderHisabContent();
}

function printHisab(){
  var d=hisabData[currentHisabDate]||{wasoli:[],kharcha:[],company:[]};
  var tw=d.wasoli.reduce(function(s,e){return s+e.amount;},0);
  var tk=d.kharcha.reduce(function(s,e){return s+e.amount;},0);
  var tc=d.company.reduce(function(s,e){return s+e.amount;},0);
  var net=tw-tk-tc;
  var win=window.open('','_blank','width=800,height=700');
  win.document.write('<!DOCTYPE html><html><head><title>Hisab Report</title><style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:Arial,sans-serif;padding:20px;}.top{background:linear-gradient(135deg,#1e293b,#334155);color:white;padding:14px;border-radius:10px;margin-bottom:14px;}h2{font-size:14px;font-weight:800;margin:12px 0 6px;}table{width:100%;border-collapse:collapse;margin-bottom:10px;}th{background:#f8fafc;padding:7px;text-align:left;font-size:12px;color:#666;border-bottom:2px solid #e5e7eb;}td{padding:7px;font-size:13px;border-bottom:1px solid #f0f0f0;}.summary{background:#f8fafc;border-radius:8px;padding:12px;margin-top:12px;}.sr{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;border-bottom:1px solid #e5e7eb;}.sr:last-child{border-bottom:none;font-size:16px;font-weight:800;}</style></head><body>');
  win.document.write('<div class="top"><h1 style="font-size:18px;font-weight:800;margin-bottom:3px;">📊 ABBAS — Daily Hisab</h1><p>Date: '+fmtD(currentHisabDate)+'</p></div>');
  if(d.wasoli.length){win.document.write('<h2 style="color:#15803d;">💰 Wasoli</h2><table><thead><tr><th>Customer</th><th>Wasoli Karne Wala</th><th>Tarika</th><th style="text-align:right;">Amount</th></tr></thead><tbody>'+d.wasoli.map(function(e){return'<tr><td>'+e.name+'</td><td>'+(e.collector||'—')+'</td><td>'+e.method+'</td><td style="text-align:right;color:#15803d;font-weight:700;">Rs '+fmt(e.amount)+'</td></tr>';}).join('')+'<tr style="background:#f0fdf4;font-weight:700;"><td colspan="3">Total</td><td style="text-align:right;color:#15803d;">Rs '+fmt(tw)+'</td></tr></tbody></table>');}
  if(d.kharcha.length){win.document.write('<h2 style="color:#dc2626;">💸 Kharcha</h2><table><thead><tr><th>Wajah</th><th style="text-align:right;">Amount</th></tr></thead><tbody>'+d.kharcha.map(function(e){return'<tr><td>'+e.name+'</td><td style="text-align:right;color:#dc2626;font-weight:700;">Rs '+fmt(e.amount)+'</td></tr>';}).join('')+'<tr style="background:#fef2f2;font-weight:700;"><td>Total</td><td style="text-align:right;color:#dc2626;">Rs '+fmt(tk)+'</td></tr></tbody></table>');}
  if(d.company.length){win.document.write('<h2 style="color:#1d4ed8;">🏢 Company Payments</h2><table><thead><tr><th>Company</th><th>Tarika</th><th style="text-align:right;">Amount</th></tr></thead><tbody>'+d.company.map(function(e){return'<tr><td>'+e.name+'</td><td>'+e.method+'</td><td style="text-align:right;color:#1d4ed8;font-weight:700;">Rs '+fmt(e.amount)+'</td></tr>';}).join('')+'<tr style="background:#eff6ff;font-weight:700;"><td colspan="2">Total</td><td style="text-align:right;color:#1d4ed8;">Rs '+fmt(tc)+'</td></tr></tbody></table>');}
  win.document.write('<div class="summary"><div class="sr"><span>💰 Wasoli</span><span style="color:#15803d;font-weight:700;">Rs '+fmt(tw)+'</span></div><div class="sr"><span>💸 Kharcha</span><span style="color:#dc2626;font-weight:700;">Rs '+fmt(tk)+'</span></div><div class="sr"><span>🏢 Company</span><span style="color:#1d4ed8;font-weight:700;">Rs '+fmt(tc)+'</span></div><div class="sr"><span>📊 Net '+(net>=0?'Faida ✅':'Nuqsan ❌')+'</span><span style="color:'+(net>=0?'#15803d':'#dc2626')+';">Rs '+fmt(Math.abs(net))+'</span></div></div>');
  win.document.write('<div style="text-align:center;margin-top:12px;font-size:11px;color:#999;">ABBAS BMS · Printed: '+new Date().toLocaleString('en-PK')+'</div></body></html>');
  win.document.close();win.focus();setTimeout(function(){win.print();},500);
}

// ══════════════════════════════════════
// PRODUCTS
// ══════════════════════════════════════
function renderProducts(){
  var c=document.getElementById('content');
  c.innerHTML='<div class="sec-header"><h2>📦 Products</h2><button class="btn blue" onclick="toggleF(\'pf\')">＋ Naya Product</button></div>'
    +'<div class="form-box" id="pf">'
      +'<div class="form-grid g2"><div class="fld"><label>Product Naam</label><input id="p-name" placeholder="Anybite..."></div><div class="fld"><label>Rate (Rs)</label><input type="number" id="p-rate" placeholder="120"></div></div>'
      +'<div class="form-grid g2"><div class="fld"><label>Unit</label><select id="p-unit"><option>Piece</option><option>Box</option><option>Carton</option><option>Dozen</option><option>Kg</option></select></div><div class="fld"><label>Category</label><input id="p-cat" placeholder="Biscuit, Cake, Chips..."></div></div>'
      +'<button class="btn blue" onclick="saveProd()">✓ Save Karein</button>'
    +'</div>'
    +'<div id="prod-list"></div>';
  renderProdList();
}

function saveProd(){
  var name=document.getElementById('p-name').value.trim();
  var rate=parseFloat(document.getElementById('p-rate').value);
  if(!name||!rate){alert('Naam aur rate zaroor bharein!');return;}
  var ex=products.find(function(p){return p.name.toLowerCase()===name.toLowerCase();});
  if(ex){dbB.ref('products/'+ex.id).update({rate:rate,unit:document.getElementById('p-unit').value,cat:document.getElementById('p-cat').value.trim()||'General'});}
  else{var id=Date.now();dbB.ref('products/'+id).set({id:id,name:name,rate:rate,unit:document.getElementById('p-unit').value,cat:document.getElementById('p-cat').value.trim()||'General'});}
  ['p-name','p-rate','p-cat'].forEach(function(i){document.getElementById(i).value='';});
  document.getElementById('pf').className='form-box';
}

function renderProdList(){
  var list=document.getElementById('prod-list');if(!list)return;
  if(!products.length){list.innerHTML='<div class="empty"><div class="empty-icon">📦</div><div class="empty-text">Koi product nahi</div></div>';return;}
  list.innerHTML=products.map(function(p){
    return'<div class="item-card"><div class="ic-left"><div class="ic-title">'+p.name+'</div><div class="ic-meta">'+p.cat+' · per '+p.unit+'</div></div>'
      +'<div class="ic-right"><div class="ic-amt blue">Rs '+p.rate+'</div><button class="ic-del" onclick="delProd('+p.id+')">🗑</button></div></div>';
  }).join('');
}

function delProd(id){if(!confirm('Delete?'))return;dbB.ref('products/'+id).remove();}

// ══════════════════════════════════════
// UTILS
// ══════════════════════════════════════
function toggleF(id){var f=document.getElementById(id);if(f)f.className=f.className.includes('show')?'form-box':'form-box show';}

// Init
document.getElementById('topbar-date').textContent=new Date().toLocaleDateString('en-PK',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
goTo('dashboard');
</script>
